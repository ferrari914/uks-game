<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>OX 서바이벌</title>
<meta name="description" content="친구들과 실시간으로 즐기는 OX 발판 서바이벌. 코드 하나로 같은 방에서 시작하세요.">
<meta property="og:type" content="website">
<meta property="og:title" content="OX 서바이벌">
<meta property="og:description" content="틀린 쪽 발판은 무너집니다. 마지막 한 명이 우승.">
<meta property="og:image" content="https://og.claude.ai/placeholder.png">
<meta name="theme-color" content="#12101A">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text y='50' font-size='48'>🕳️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --ink:#12101A; --slab:#1D1A2B; --line:#3A3550;
    --o:#2BD9C4; --x:#FF4D6D; --gold:#FFC857; --paper:#EDE9F5; --mute:#8E88A8;
    --disp:'Black Han Sans',system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    --body:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  }
  html,body{margin:0;padding:0;background:var(--ink);color:var(--paper);font-family:var(--body);
    overscroll-behavior:none;-webkit-text-size-adjust:100%}
  body{min-height:100dvh}
  #app{max-width:820px;margin:0 auto;padding:14px 14px calc(28px + env(safe-area-inset-bottom))}
  .hero{padding:22px 0 8px;text-align:center}
  .hero .kicker{font-size:12px;letter-spacing:.42em;color:var(--mute);margin-bottom:14px}
  .logo{font-family:var(--disp);font-size:clamp(44px,13vw,84px);line-height:.92;margin:0}
  .logo .o{color:var(--o);text-shadow:0 0 26px rgba(43,217,196,.45)}
  .logo .x{color:var(--x);text-shadow:0 0 26px rgba(255,77,109,.45)}
  .logo .sub{display:block;font-size:clamp(20px,5.3vw,34px);color:var(--paper);margin-top:8px;letter-spacing:.09em}
  .tag{color:var(--mute);font-size:14px;margin-top:12px;line-height:1.6}
  .card{background:var(--slab);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:16px}
  .card h3{font-family:var(--disp);font-size:17px;margin:0 0 12px;letter-spacing:.04em}
  label.lbl{display:block;font-size:12px;color:var(--mute);margin:0 0 7px;letter-spacing:.06em}
  input[type=text]{width:100%;background:#0D0B14;border:1px solid var(--line);color:var(--paper);
    border-radius:12px;padding:13px 14px;font-size:16px;font-family:var(--body);outline:none}
  input[type=text]:focus{border-color:var(--gold)}
  .emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
  .emoji-grid button{aspect-ratio:1;font-size:20px;background:#0D0B14;border:1px solid transparent;
    border-radius:10px;cursor:pointer;padding:0;transition:.15s}
  .emoji-grid button[aria-pressed=true]{border-color:var(--gold);background:#2A2438;transform:scale(1.08)}
  .row{display:flex;gap:10px}.row>*{flex:1}
  button.btn{font-family:var(--disp);font-size:17px;letter-spacing:.05em;border:none;border-radius:14px;
    padding:15px 16px;cursor:pointer;transition:transform .12s;color:#12101A}
  button.btn:active{transform:translateY(2px)}
  button.btn:disabled{opacity:.35;cursor:not-allowed}
  .btn-gold{background:var(--gold)}.btn-o{background:var(--o)}
  .btn-ghost{background:transparent;color:var(--paper);border:1px solid var(--line)}
  .note{font-size:11.5px;color:var(--mute);line-height:1.65;margin-top:14px}
  .err{color:var(--x);font-size:13px;margin-top:10px;min-height:18px}
  .conn{position:fixed;top:0;left:0;right:0;text-align:center;font-size:11.5px;padding:6px;
    background:#2A1520;color:var(--x);z-index:99;letter-spacing:.04em;display:none}
  .conn.show{display:block}
  .codebox{text-align:center;padding:22px 16px;background:repeating-linear-gradient(135deg,#1D1A2B 0 12px,#201C30 12px 24px);
    border:1px solid var(--line);border-radius:18px}
  .codebox .lbl2{font-size:11px;letter-spacing:.4em;color:var(--mute)}
  .code{font-family:var(--disp);font-size:clamp(40px,13vw,66px);letter-spacing:.16em;color:var(--gold);
    margin:6px 0 2px;text-shadow:0 0 30px rgba(255,200,87,.3)}
  .players{display:flex;flex-wrap:wrap;gap:8px}
  .pchip{display:flex;align-items:center;gap:7px;background:#0D0B14;border:1px solid var(--line);
    border-radius:999px;padding:7px 13px 7px 9px;font-size:13.5px}
  .pchip .av{font-size:18px}.pchip.host{border-color:var(--gold)}
  .pchip .crown{font-size:11px;color:var(--gold)}
  .opt{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
  .opt button{background:#0D0B14;border:1px solid var(--line);color:var(--mute);border-radius:10px;
    padding:9px 13px;font-size:13px;cursor:pointer;font-family:var(--body)}
  .opt button[aria-pressed=true]{border-color:var(--o);color:var(--o);background:#132723}
  .opt.modes{display:flex;gap:8px;margin-bottom:6px}
  .opt.modes button{flex:1;font-family:var(--disp);font-size:14.5px;letter-spacing:.03em;padding:13px 6px}
  .opt.modes button[aria-pressed=true]{border-color:var(--gold);color:var(--gold);background:#2A2410}
  .modedesc{margin:0 0 14px;font-size:12px;color:var(--mute);line-height:1.6}
  .modedesc b{color:var(--paper)}
  .chatlog{height:190px;overflow-y:auto;overscroll-behavior:contain;background:#0D0B14;
    border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:7px}
  .cmsg{display:flex;gap:6px;align-items:baseline;font-size:13px;line-height:1.45;
    word-break:break-word;overflow-wrap:anywhere}
  .cmsg .cav{flex:0 0 auto;font-size:15px}
  .cmsg .cnm{flex:0 0 auto;color:var(--gold);font-weight:700;font-size:12px}
  .cmsg .ctx{min-width:0}
  .cempty{margin:auto;color:var(--mute);font-size:12.5px;text-align:center;line-height:1.6}
  .chatin{display:flex;gap:8px;margin-top:10px}
  .chatin input{flex:1;min-width:0}
  .chatin .btn{flex:0 0 auto;font-size:14px;padding:0 20px}
  .cmsg.mine .cnm{color:var(--o)}

  /* 플로팅 채팅 (게임 중) */
  .chatdock{display:none}
  .chatdock.on{display:block}
  .chatfab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:82;
    width:54px;height:54px;border-radius:50%;border:1px solid var(--line);background:var(--slab);
    color:var(--paper);font-size:23px;line-height:1;cursor:pointer;padding:0;
    box-shadow:0 8px 26px rgba(0,0,0,.55)}
  .chatfab:active{transform:translateY(2px)}
  .cbadge{position:absolute;top:-4px;right:-4px;min-width:21px;height:21px;padding:0 5px;
    border-radius:99px;background:var(--x);color:#fff;font-family:var(--body);font-size:11px;
    font-weight:700;line-height:21px;display:none}
  .cbadge.show{display:block}
  .chatpanel{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:440px;z-index:81;
    background:var(--slab);border:1px solid var(--line);border-bottom:none;border-radius:18px 18px 0 0;
    padding:12px 12px calc(12px + env(safe-area-inset-bottom));
    transform:translateY(112%);transition:transform .28s cubic-bezier(.3,1,.5,1);
    box-shadow:0 -14px 44px rgba(0,0,0,.62)}
  .chatpanel.open{transform:none}
  .chathead{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
  .chathead span{font-family:var(--disp);font-size:15px;letter-spacing:.06em}
  .cx{background:transparent;border:1px solid var(--line);color:var(--mute);border-radius:9px;
    width:30px;height:30px;font-size:13px;cursor:pointer;padding:0}
  .chatpanel .chatlog{height:104px}
  body.chatopen #app{padding-bottom:300px}
  .chatpanel.open~.chatfab{opacity:0;pointer-events:none}
  .chatfab{transition:opacity .2s}

  /* 버전 정보 시트 */
  .sheet{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;
    padding:18px;background:rgba(8,6,14,.74)}
  .sheet.show{display:flex}
  .vcard{width:100%;max-width:460px;background:var(--slab);border:1px solid var(--line);
    border-radius:18px;padding:16px}
  .vhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .vhead h2{font-family:var(--disp);font-size:17px;margin:0;letter-spacing:.05em}
  .verNow{margin:0 0 11px;font-size:12.5px;color:var(--mute);line-height:1.8}
  .verNow b{color:var(--gold);font-size:20px;font-family:var(--disp);letter-spacing:.03em}
  .verList{list-style:none;margin:0;padding:0;max-height:52vh;overflow-y:auto;overscroll-behavior:contain;
    display:flex;flex-direction:column;gap:8px}
  .verList>li{background:#0D0B14;border:1px solid var(--line);border-radius:12px;padding:11px 13px}
  .verList>li.cur{border-color:var(--gold);background:rgba(255,200,87,.07)}
  .vh{display:flex;align-items:center;gap:7px;margin-bottom:5px}
  .vh b{font-family:var(--disp);font-size:14px;letter-spacing:.03em}
  .vtag{font-family:var(--body);font-size:9px;font-weight:700;letter-spacing:.08em;color:#12101A;
    background:var(--gold);border-radius:5px;padding:2px 6px}
  .vitems p{margin:0;font-size:12px;line-height:1.75;color:var(--mute);
    padding-left:11px;text-indent:-11px;word-break:keep-all}
  .hud{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .qno{font-family:var(--disp);font-size:14px;letter-spacing:.16em;color:var(--gold)}
  .alivecnt{font-size:12px;color:var(--mute)}
  .qcard{background:var(--slab);border:1px solid var(--line);border-radius:18px;padding:20px 18px;
    text-align:center;min-height:92px;display:flex;align-items:center;justify-content:center}
  .qtext{font-family:var(--disp);font-size:clamp(18px,4.6vw,26px);line-height:1.45}
  .tbar{height:7px;background:#0D0B14;border-radius:99px;overflow:hidden;margin-top:10px;border:1px solid var(--line)}
  .tfill{height:100%;background:var(--gold);width:100%;transition:width .12s linear}
  .tfill.warn{background:var(--x)}
  .stage{position:relative;margin-top:14px;height:clamp(250px,40vh,330px);perspective:900px;overflow:hidden;border-radius:18px}
  .stage.quake{animation:quake .55s cubic-bezier(.36,.07,.19,.97)}
  @keyframes quake{8%{transform:translate(-6px,4px)}17%{transform:translate(7px,-4px)}26%{transform:translate(-8px,-2px)}
    36%{transform:translate(6px,5px)}47%{transform:translate(-5px,-4px)}60%{transform:translate(4px,3px)}
    74%{transform:translate(-3px,2px)}87%{transform:translate(2px,-1px)}100%{transform:none}}
  .slabs{position:absolute;inset:0;display:flex;gap:10px}
  .slab{flex:1;border-radius:16px;position:relative;
    background:radial-gradient(ellipse at 50% 34%,#06050B 0%,#0A0812 55%,#12101A 100%);
    box-shadow:inset 0 0 46px rgba(0,0,0,.9)}
  .pane{position:absolute;inset:0;border-radius:16px;
    transition:transform .85s cubic-bezier(.5,-.06,.75,.34),opacity .85s ease-in,filter .4s;
    will-change:transform,opacity}
  .pane.a{clip-path:polygon(0 0,44% 0,52% 18%,45% 38%,55% 60%,47% 82%,53% 100%,0 100%)}
  .pane.b{clip-path:polygon(44% 0,100% 0,100% 100%,53% 100%,47% 82%,55% 60%,45% 38%,52% 18%)}
  .zlabel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:var(--disp);
    font-size:clamp(80px,22vw,150px);opacity:.13;pointer-events:none;line-height:1}
  .slab.o .pane{background:linear-gradient(180deg,rgba(43,217,196,.16),rgba(43,217,196,.04));border:1.5px solid rgba(43,217,196,.5)}
  .slab.o .zlabel{color:var(--o)}
  .slab.x .pane{background:linear-gradient(180deg,rgba(255,77,109,.16),rgba(255,77,109,.04));border:1.5px solid rgba(255,77,109,.5)}
  .slab.x .zlabel{color:var(--x)}
  .slab.correct .pane{filter:brightness(1.5) saturate(1.3);animation:safepulse .9s ease-out}
  @keyframes safepulse{0%{filter:brightness(2.7) saturate(1.7)}100%{filter:brightness(1.5) saturate(1.3)}}
  .crack{position:absolute;inset:0;opacity:0;pointer-events:none;background:#FFF6DE;z-index:3;
    filter:drop-shadow(0 0 8px rgba(255,246,222,.95));
    clip-path:polygon(44% 0,52% 18%,45% 38%,55% 60%,47% 82%,53% 100%,54.9% 100%,48.9% 82%,56.9% 60%,46.9% 38%,53.9% 18%,45.9% 0)}
  .slab.cracking .crack{animation:crackflash .5s ease-out forwards}
  @keyframes crackflash{0%{opacity:0;transform:scaleY(.25)}45%{opacity:1;transform:scaleY(1)}100%{opacity:1}}
  .slab.cracking .pane{animation:rumble .55s linear}
  @keyframes rumble{0%,100%{transform:none}14%{transform:translate(-2px,1px)}28%{transform:translate(2px,-1px)}
    43%{transform:translate(-3px,-1px)}57%{transform:translate(3px,1px)}72%{transform:translate(-2px,2px)}86%{transform:translate(1px,-1px)}}
  .slab.broken .pane.a{transform:translate(-15%,126%) rotate(-27deg);opacity:0}
  .slab.broken .pane.b{transform:translate(15%,133%) rotate(23deg);opacity:0}
  .debris{position:absolute;pointer-events:none;border-radius:2px;z-index:4;
    animation:deb var(--dur,.95s) cubic-bezier(.25,.5,.6,1) forwards;will-change:transform,opacity}
  @keyframes deb{0%{transform:translate(0,0) rotate(0);opacity:1}
    100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
  .chars{position:absolute;inset:0;pointer-events:none;z-index:5}
  .ch{position:absolute;width:64px;margin-left:-32px;text-align:center;
    transition:left .65s cubic-bezier(.34,1.3,.5,1),top .65s cubic-bezier(.34,1.3,.5,1)}
  .ch .body{transition:transform .6s}
  .ch .av{font-size:30px;line-height:1;filter:drop-shadow(0 3px 6px rgba(0,0,0,.6))}
  .ch .nm{font-size:10.5px;background:rgba(13,11,20,.75);border-radius:99px;padding:2px 6px;
    display:inline-block;margin-top:3px;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ch.me .nm{background:var(--gold);color:#12101A;font-weight:700}
  .ch.dying{z-index:7}
  .ch.dying .body{animation:fall 1.25s cubic-bezier(.4,.02,.85,.45) forwards}
  @keyframes fall{
    0%{transform:translateY(0) rotate(0) scale(1)}
    10%{transform:translateY(-18px) rotate(-12deg) scale(1.06)}
    21%{transform:translateY(-10px) rotate(11deg) scale(1.02)}
    32%{transform:translateY(-15px) rotate(-6deg) scale(1)}
    100%{transform:translateY(255px) rotate(210deg) scale(.5);opacity:0}}
  .ch .bub{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:8px;
    background:var(--paper);color:#12101A;font-size:11px;border-radius:10px;padding:5px 8px;width:136px;
    line-height:1.35;box-shadow:0 6px 18px rgba(0,0,0,.55);opacity:0;z-index:9}
  .ch .bub::after{content:'';position:absolute;top:100%;left:50%;margin-left:-5px;
    border:5px solid transparent;border-top-color:var(--paper)}
  .ch.showbub .bub{animation:bubpop .5s cubic-bezier(.2,1.6,.4,1) .22s forwards,
    bubfade .7s ease-in 3.7s forwards}
  @keyframes bubpop{0%{opacity:0;transform:translateX(-50%) translateY(10px) scale(.5)}
    100%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
  @keyframes bubfade{0%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
    100%{opacity:0;transform:translateX(-50%) translateY(-12px) scale(.95)}}
  .controls{display:flex;gap:10px;margin-top:14px}
  .pick{flex:1;font-family:var(--disp);font-size:clamp(30px,9vw,46px);border:2px solid var(--line);
    border-radius:18px;padding:14px 0;background:#0D0B14;cursor:pointer;transition:.15s;color:var(--mute)}
  .pick.o[aria-pressed=true]{background:var(--o);color:#12101A;border-color:var(--o);box-shadow:0 0 30px rgba(43,217,196,.4)}
  .pick.x[aria-pressed=true]{background:var(--x);color:#12101A;border-color:var(--x);box-shadow:0 0 30px rgba(255,77,109,.4)}
  .pick:disabled{opacity:.3;cursor:not-allowed}
  .statusbar{margin-top:12px;text-align:center;font-size:13.5px;color:var(--mute);min-height:20px;line-height:1.6}
  .statusbar b{color:var(--gold)}
  .deaths{margin-top:12px;background:var(--slab);border:1px solid var(--line);border-radius:16px;padding:14px}
  .deaths h4{font-family:var(--disp);font-size:13px;letter-spacing:.14em;color:var(--x);margin:0 0 9px}
  .deaths ul{margin:0;padding:0;list-style:none;display:grid;gap:7px}
  .deaths li{font-size:13px;line-height:1.45;animation:dropin .5s cubic-bezier(.2,1.4,.4,1) both;
    animation-delay:calc(var(--i,0)*.13s + .35s)}
  .deaths li span{color:var(--mute)}
  @keyframes dropin{0%{opacity:0;transform:translateY(-16px) rotate(-2deg)}
    62%{opacity:1;transform:translateY(3px) rotate(.6deg)}100%{opacity:1;transform:none}}
  .grave{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .grave .g{font-size:11px;color:var(--mute);background:#0D0B14;border:1px solid var(--line);
    border-radius:99px;padding:4px 9px;filter:grayscale(1);opacity:.75}
  .winner{position:relative;overflow:hidden;text-align:center;padding:30px 16px;background:
    radial-gradient(circle at 50% 0%,rgba(255,200,87,.18),transparent 65%),var(--slab);
    border:1px solid var(--gold);border-radius:20px}
  .winner .av{display:inline-block;font-size:70px;animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
  .shine{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .shine::before{content:'';position:absolute;top:-60%;left:-45%;width:34%;height:220%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);
    transform:rotate(18deg);animation:sweep 2.2s ease-in-out .45s 2}
  @keyframes sweep{0%{left:-45%}100%{left:118%}}
  .conf{position:absolute;top:-22px;width:9px;height:14px;border-radius:2px;pointer-events:none;
    animation:confdrop var(--dur,2.6s) linear var(--del,0s) forwards}
  @keyframes confdrop{0%{transform:translateY(0) rotate(0);opacity:1}
    85%{opacity:1}100%{transform:translateY(var(--dy,320px)) rotate(var(--rot,540deg));opacity:0}}
  .rollcall{margin-top:16px}
  .rollcall h4{font-family:var(--disp);font-size:13px;letter-spacing:.14em;color:var(--x);margin:0 0 2px;
    animation:dropin .5s cubic-bezier(.2,1.4,.4,1) both;animation-delay:.4s}
  .rc{display:flex;align-items:center;gap:11px;background:var(--slab);border:1px solid var(--line);
    border-radius:14px;padding:11px 13px;margin-top:8px;
    animation:rcin .55s cubic-bezier(.2,1.35,.4,1) both;animation-delay:calc(var(--i,0)*.15s + .55s)}
  @keyframes rcin{0%{opacity:0;transform:translateY(-32px) rotate(-3deg)}
    58%{opacity:1;transform:translateY(5px) rotate(1.2deg)}78%{transform:translateY(-2px) rotate(-.5deg)}
    100%{opacity:1;transform:none}}
  .rc .av{flex:0 0 auto;font-size:26px;line-height:1;filter:grayscale(.9);opacity:.85}
  .rc .txt{flex:1;min-width:0}
  .rc .who{font-size:14px;font-weight:700}
  .rc .why{font-size:12.5px;color:var(--mute);line-height:1.45;margin-top:2px}
  .rc .qn{flex:0 0 auto;font-family:var(--disp);font-size:11px;letter-spacing:.1em;color:var(--x);
    border:1px solid rgba(255,77,109,.35);border-radius:99px;padding:4px 8px;background:rgba(255,77,109,.08)}
  .rc.top{border-color:var(--gold);background:rgba(255,200,87,.07)}
  .rc .rnk{flex:0 0 22px;text-align:center;font-family:var(--disp);font-size:15px;color:var(--mute)}
  .rc.top .rnk{color:var(--gold)}
  .rc .av.win{filter:none;opacity:1}
  .rc .qn.sc{color:var(--gold);border-color:rgba(255,200,87,.35);background:rgba(255,200,87,.08)}
  .rc .mez{font-size:10px;background:var(--gold);color:#12101A;border-radius:99px;padding:1px 6px;font-weight:700}
  .rollcall h4.gold{color:var(--gold)}
  .winner .wsc{margin-top:9px;font-size:13px;color:var(--gold);letter-spacing:.08em}
  @keyframes pop{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}

/* ================= 통신 계층 ================= */
var BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081/mqtt'];
var MQTT_CDN=['https://unpkg.com/mqtt@5.14.1/dist/mqtt.min.js','https://cdn.jsdelivr.net/npm/mqtt@5.14.1/dist/mqtt.min.js'];

function loadMqtt(){
  return new Promise(function(res,rej){
    if(window.mqtt)return res();
    var i=0;
    (function next(){
      if(i>=MQTT_CDN.length)return rej(new Error('mqtt-load'));
      var s=document.createElement('script');
      s.src=MQTT_CDN[i++];s.onload=function(){res()};s.onerror=next;
      document.head.appendChild(s);
    })();
  });
}
function makeMqttNet(){
  var cl=null,subs={},bi=0;
  return {
    connect:function(onState){
      return loadMqtt().then(function(){
        return new Promise(function(res,rej){
          (function tryOne(){
            if(bi>=BROKERS.length)return rej(new Error('broker'));
            var url=BROKERS[bi++];
            var c=window.mqtt.connect(url,{clientId:'ox_'+Math.random().toString(16).slice(2,10),
              clean:true,reconnectPeriod:2500,connectTimeout:7000,keepalive:30});
            var done=false;
            var to=setTimeout(function(){if(!done){done=true;try{c.end(true)}catch(e){};tryOne()}},8000);
            c.on('connect',function(){ if(done&&cl!==c)return; done=true;clearTimeout(to);cl=c;
              Object.keys(subs).forEach(function(t){c.subscribe(t,{qos:0})});
              onState('on');res(url);});
            c.on('error',function(){ if(!done){done=true;clearTimeout(to);try{c.end(true)}catch(e){};tryOne()} });
            c.on('offline',function(){onState('off')});
            c.on('reconnect',function(){onState('re')});
            c.on('message',function(t,p){
              var fn=subs[t];if(!fn)return;
              var s=p.toString();
              try{ fn(s?JSON.parse(s):null) }catch(e){}
            });
          })();
        });
      });
    },
    sub:function(t,fn){subs[t]=fn;if(cl)cl.subscribe(t,{qos:0})},
    unsub:function(t){delete subs[t];if(cl)cl.unsubscribe(t)},
    pub:function(t,obj,retain){if(cl)cl.publish(t,obj===null?'':JSON.stringify(obj),{qos:0,retain:!!retain})},
    end:function(){try{cl&&cl.end(true)}catch(e){}}
  };
}

function rid(n){var c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',s='';for(var i=0;i<n;i++)s+=c[Math.floor(Math.random()*c.length)];return s}
function esc(s){return String(s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
function clean(s){var t=String(s||'').replace(/[^0-9A-Za-z가-힣ㄱ-ㅎㅏ-ㅣ ]/g,'').trim().slice(0,8);return t||'익명'}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function pickOne(a){return a[Math.floor(Math.random()*a.length)]}

function fail(m){S.err=m;var e=document.getElementById('er');if(e)e.textContent=m}
function setNet(s){
  S.net=s;
  if(s==='on'){connBar.classList.remove('show')}
  else{connBar.textContent=s==='re'?'연결이 끊겨 재접속 중…':'네트워크 연결 대기 중…';connBar.classList.add('show')}

function ensureNet(){
  if(S.net==='on')return Promise.resolve();
  return NET.connect(setNet).then(function(){setNet('on')});
}

async function createRoom(){
  S.name=clean(document.getElementById('nm').value);
  fail('연결 중…');
  try{ await ensureNet() }catch(e){ fail('서버에 연결하지 못했습니다. 잠시 후 다시 시도하거나 다른 네트워크에서 열어보세요.'); return }
  S.code=rid(5); S.isHost=true;
  G={gameNo:0,phase:'lobby',round:null,qIndex:0,questions:[],endsAt:0,players:{},
     question:null,answer:null,deaths:[],mercy:false,winner:null,qCount:10,timeLimit:12,
     mode:'survival',lastPub:0};
  NET.sub(tEv(),onEvent);
  NET.sub(tChat(),onChat);
  addPlayer(S.pid,S.name,S.emojiIdx);
  startHost(); startHeartbeat();
  S.screen='lobby'; publish(true); render();
}
async function joinRoom(){
  S.name=clean(document.getElementById('nm').value);
  var f=document.getElementById('cd');
  var c=(f.value||'').trim().toUpperCase();
  if(c.length!==5){fail('코드 5자리를 입력하세요.');return}
  fail('연결 중…');
  try{ await ensureNet() }catch(e){ fail('서버에 연결하지 못했습니다. 잠시 후 다시 시도해 주세요.'); return }
  S.code=c; S.isHost=false; S.lastState=0;
  NET.sub(tState(),onState);
  NET.sub(tChat(),onChat);
  NET.pub(tEv(),{t:'join',pid:S.pid,name:S.name,em:S.emojiIdx});
  fail('방 찾는 중…');
  var waited=0;
  var iv=setInterval(function(){
    waited+=250;
    if(S.lastState){clearInterval(iv);return}
    if(waited>5000){clearInterval(iv);NET.unsub(tState());S.code='';fail('그 코드의 방을 찾지 못했어요. 코드를 다시 확인해 주세요.')}
  },250);
  startHeartbeat();
}
function leaveRoom(){
  if(S.code){
    NET.pub(tEv(),{t:'leave',pid:S.pid});
    if(S.isHost)NET.pub(tState(),null,true);
    NET.unsub(tState());NET.unsub(tEv());NET.unsub(tChat());
  }
  clearInterval(hostTimer);clearInterval(hbTimer);clearInterval(uiTimer);
  hostTimer=hbTimer=uiTimer=null;
  V=null;G=null;S.code='';S.isHost=false;S.myChoice=null;S.screen='home';S.err='';S.seenRound=null;
  S.fxRd=null;S.overKey=null;chEls={};
  S.chat=[];S.unread=0;S.chatSeen={};closeChat();
  if(location.hash)history.replaceState(null,'',location.pathname);
  render();
}
function startHeartbeat(){
  clearInterval(hbTimer);
  hbTimer=setInterval(function(){
    if(!S.code)return;
    NET.pub(tEv(),{t:'hb',pid:S.pid,name:S.name,em:S.emojiIdx});
  },3500);
}

/* ================= 클라이언트 수신 ================= */
function onState(v){
  if(!v){ if(S.screen!=='home'){alert('방장이 방을 닫았습니다.');leaveRoom()} return }
  S.lastState=Date.now(); S.offset=v.pub-Date.now(); V=v; fail(''); applyView();
}

/* ================= 방장 로직 ================= */
function addPlayer(pid,name,em){
  if(G.players[pid]){G.players[pid].seen=Date.now();return}
  G.players[pid]={pid:pid,name:clean(name),emoji:EMOJIS[(+em||0)%EMOJIS.length],
    alive:G.phase==='lobby',choice:null,
    death:G.phase==='lobby'?null:'늦게 도착해서 관전 중 👀',
    deadRound:G.phase==='lobby'?null:'-',zone:null,score:0,fell:false,seen:Date.now()};
  G.dirty=true;
}
function onEvent(m){
  if(!S.isHost||!G||!m)return;
  if(m.t==='join'||m.t==='hb'){
    if(G.players[m.pid]){G.players[m.pid].seen=Date.now();
      if(m.name&&G.players[m.pid].name!==clean(m.name)){G.players[m.pid].name=clean(m.name);G.dirty=true}}
    else addPlayer(m.pid,m.name,m.em);
    if(m.t==='join')G.dirty=true;
  }else if(m.t==='leave'){
    if(G.players[m.pid]){delete G.players[m.pid];G.dirty=true}
  }else if(m.t==='pick'){
    var p=G.players[m.pid];
    if(p&&p.alive&&G.phase==='question'&&m.rd===G.round&&(m.c==='O'||m.c==='X')){
      p.choice=m.c;p.zone=m.c;p.seen=Date.now();G.dirty=true;
    }
  }
}
function startHost(){
  clearInterval(hostTimer);
  hostTimer=setInterval(hostTick,220);
}
function hostTick(){
  if(!G)return;
  var t=Date.now();
  for(var pid in G.players){
    if(pid!==S.pid&&t-G.players[pid].seen>11000){delete G.players[pid];G.dirty=true}
  }
  if(G.phase==='ready'){ if(t>=G.endsAt){startQuestion();G.dirty=true} }
  else if(G.phase==='question'){
    if(t>=G.endsAt){resolveRound();G.dirty=true}      // 제한시간 바가 다 닳아야 판정한다
  }
  else if(G.phase==='reveal'){ if(t>=G.endsAt){afterReveal();G.dirty=true} }
  if(G.dirty||t-G.lastPub>1200)publish();
}
function startGame(){
  G.gameNo++; G.questions=shuffle(QUESTIONS).slice(0,G.qCount); G.qIndex=0;
  G.deaths=[]; G.winner=null; G.mercy=false;
  for(var pid in G.players){var p=G.players[pid];
    p.alive=true;p.choice=null;p.death=null;p.deadRound=null;p.zone=null;p.score=0;p.fell=false}
  G.phase='ready'; G.endsAt=Date.now()+3400; G.dirty=true; publish(true);
}
function startQuestion(){
  var q=G.questions[G.qIndex];
  G.round=G.gameNo+'_'+(G.qIndex+1); G.question=q.q; G.answer=q.a;
  G.deaths=[]; G.mercy=false;
  for(var pid in G.players){var p=G.players[pid];p.fell=false;if(p.alive){p.choice=null;p.zone=null}}
  G.phase='question'; G.endsAt=Date.now()+G.timeLimit*1000; S.myChoice=null;
}
function resolveRound(){
  var inplay=[],pid;for(pid in G.players)if(G.players[pid].alive)inplay.push(G.players[pid]);
  var wrong=inplay.filter(function(p){return p.choice!==G.answer});
  G.deaths=[];G.mercy=false;
  inplay.forEach(function(p){if(p.choice===G.answer)p.score=(p.score||0)+1});
  if(G.mode==='survival'&&wrong.length===inplay.length&&inplay.length>1){
    G.mercy=true;                                  // 서바이벌에서 전원 오답이면 무효
  }else{
    var pool=shuffle(DEATHS);
    wrong.forEach(function(p,i){
      if(G.mode==='survival')p.alive=false;        // 점수전은 탈락 없이 다음 라운드에 복귀
      p.fell=true;
      p.death=p.choice?pool[i%pool.length]:pickOne(TIMEOUT_DEATHS);
      p.deadRound=G.round;p.zone=p.choice||null;
      G.deaths.push({name:p.name,emoji:p.emoji,death:p.death});
    });
  }
  G.phase='reveal'; G.endsAt=Date.now()+5200;
}
function afterReveal(){
  var alive=[],pid;for(pid in G.players)if(G.players[pid].alive)alive.push(G.players[pid]);
  G.qIndex++;
  var last=G.qIndex>=G.questions.length;
  if(G.mode==='score'){                            // 점수전: 라운드를 다 채워야 끝난다
    if(!last){G.phase='ready';G.endsAt=Date.now()+2600;return}
    var best=-1;
    alive.forEach(function(p){if((p.score||0)>best)best=p.score||0});
    G.winner=alive.filter(function(p){return (p.score||0)===best})
                  .map(function(p){return {name:p.name,emoji:p.emoji,score:p.score||0}});
    G.phase='over';return;
  }
  if(alive.length<=1||last){                       // 서바이벌: 한 명 남거나 문제 소진
    G.winner=alive.map(function(p){return {name:p.name,emoji:p.emoji,score:p.score||0}});
    G.phase='over';
  }else{ G.phase='ready'; G.endsAt=Date.now()+2600 }
}
function publish(force){
  if(!G)return;
  G.dirty=false; G.lastPub=Date.now();
  var list=[];for(var pid in G.players){var p=G.players[pid];
    list.push({pid:p.pid,name:p.name,emoji:p.emoji,alive:p.alive,choice:p.choice,death:p.death,
               dr:p.deadRound,zone:p.zone,sc:p.score||0,fl:!!p.fell})}
  var v={ph:G.phase,rd:G.round,qi:G.qIndex,total:G.questions.length,q:G.question,
    ans:(G.phase==='reveal'||G.phase==='over')?G.answer:null,endsAt:G.endsAt,pub:Date.now(),
    host:S.pid,mercy:G.mercy,deaths:G.deaths,winner:G.winner,tl:G.timeLimit,qc:G.qCount,
    mode:G.mode,players:list};
  V=v;S.offset=0;S.lastState=Date.now();
  NET.pub(tState(),v,true);
  applyView();
}

/* ================= 채팅 (전용 토픽 · 대기실/게임 중 공용) ================= */
function onChat(m){
  if(!m||typeof m.x!=='string'||!m.pid)return;
  var now=Date.now(),last=S.chatSeen[m.pid]||0;
  if(now-last<250)return;                              // 수신 측 최소 간격
  S.chatSeen[m.pid]=now;
  pushChat({id:String(m.id||'').slice(0,8),pid:String(m.pid).slice(0,8),
            n:clean(m.n),e:String(m.e||'💬').slice(0,4),
            x:String(m.x).replace(/\s+/g,' ').trim().slice(0,80)});
}
function pushChat(m){
  if(!m.x)return;
  for(var i=0;i<S.chat.length;i++)if(S.chat[i].id===m.id)return;   // 내 메시지 에코 중복 제거
  S.chat.push(m);
  if(S.chat.length>30)S.chat.shift();
  if(m.pid!==S.pid&&!chatVisible())S.unread++;
  paintChat();
}
function chatVisible(){return S.screen==='lobby'||S.chatOpen}
function sendChat(inp){
  if(!inp||!S.code)return;
  var t=inp.value.replace(/\s+/g,' ').trim().slice(0,80);
  if(!t)return;
  var now=Date.now();
  if(now-S.lastSent<600)return;                        // 도배 방지
  S.lastSent=now; inp.value='';
  var m={id:rid(6),pid:S.pid,n:S.name,e:EMOJIS[S.emojiIdx%EMOJIS.length],x:t};
  pushChat(m);                                         // 내 화면에는 즉시
  NET.pub(tChat(),m);
}
function paintChat(){
  var boxes=document.querySelectorAll('.chatlog');
  var key=S.chat.length+'|'+(S.chat.length?S.chat[S.chat.length-1].id:'');
  for(var i=0;i<boxes.length;i++){
    var b=boxes[i];
    if(b.getAttribute('data-k')===key)continue;        // 내용 그대로면 다시 그리지 않는다
    b.setAttribute('data-k',key);
    b.innerHTML=S.chat.length?S.chat.map(function(c){
      return '<div class="cmsg'+(c.pid===S.pid?' mine':'')+'"><span class="cav">'+esc(c.e)+'</span>'+
             '<span class="cnm">'+esc(c.n)+'</span><span class="ctx">'+esc(c.x)+'</span></div>'}).join('')
      :'<div class="cempty">아직 메시지가 없습니다. 먼저 인사해 보세요 👋</div>';
    b.scrollTop=b.scrollHeight;
  }
  paintDock();
}
function paintDock(){
  var dock=document.getElementById('cdock');if(!dock)return;
  var show=!!S.code&&S.screen!=='home'&&S.screen!=='lobby';   // 대기실은 카드가 따로 있다
  dock.classList.toggle('on',show);
  if(!show&&S.chatOpen)closeChat();
  var bd=document.getElementById('cbadge');
  if(bd){bd.textContent=S.unread>9?'9+':String(S.unread);bd.classList.toggle('show',S.unread>0)}
}
function openChat(){
  S.chatOpen=true;S.unread=0;
  document.body.classList.add('chatopen');      // 문제가 길어 O·X가 가려져도 스크롤로 올릴 수 있게
  var pn=document.getElementById('cpanel');if(pn)pn.classList.add('open');
  var lg=document.getElementById('dlog');if(lg)lg.scrollTop=lg.scrollHeight;
  paintDock();
  var it=document.getElementById('dmsg');if(it)setTimeout(function(){it.focus()},80);
}
function closeChat(){
  S.chatOpen=false;document.body.classList.remove('chatopen');
  var pn=document.getElementById('cpanel');if(pn)pn.classList.remove('open');
  paintDock();
}

function copy(txt,btn,orig){
  var done=function(){btn.textContent='복사했어요';setTimeout(function(){btn.textContent=orig},1800)};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done,function(){fallback()});
  }else fallback();
  function fallback(){
    var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');done()}catch(e){prompt('복사해서 공유하세요',txt)}
    document.body.removeChild(ta);
  }
}

var chEls={};
function paintGame(){
  if(!V||!document.getElementById('qt'))return;
  var aliveN=V.players.filter(function(p){return p.alive}).length;
  var scoreMode=V.mode==='score';
  document.getElementById('qno').textContent=V.ph==='ready'?'준비'
    :(scoreMode?'R ':'Q ')+(V.qi+1)+' / '+V.total;
  var acEl=document.getElementById('ac');
  if(scoreMode){
    var mySc=null,topSc=0;
    V.players.forEach(function(p){if(p.pid===S.pid)mySc=p.sc||0;if((p.sc||0)>topSc)topSc=p.sc||0});
    acEl.textContent=(mySc===null?'':'내 점수 '+mySc+' · ')+'최고 '+topSc+'점';
  }else acEl.textContent='생존 '+aliveN+'명';
  document.getElementById('qt').textContent=V.ph==='ready'?'다음 문제 준비…':(V.q||'');

  setSlabFx();

  var arena=V.players.filter(function(p){return p.alive||p.dr===V.rd});
  var g={O:[],X:[],W:[]};
  arena.forEach(function(p){
    var c=p.zone||p.choice;
    if(p.pid===S.pid&&S.myChoice&&p.alive)c=S.myChoice;
    g[c==='O'?'O':c==='X'?'X':'W'].push(p);
  });
  var live={},box=document.getElementById('ch');
  ['O','X','W'].forEach(function(z){
    g[z].forEach(function(p,i){
      live[p.pid]=1;
      var el=chEls[p.pid];
      if(!el){el=document.createElement('div');el.className='ch';
        el.innerHTML='<div class="bub"></div><div class="body"><div class="av"></div><div class="nm"></div></div>';
        el.style.left='50%';el.style.top='120%';box.appendChild(el);chEls[p.pid]=el}
      if(!el.isConnected)box.appendChild(el);
      el.querySelector('.av').textContent=p.emoji;
      el.querySelector('.nm').textContent=p.name;
      el.classList.toggle('me',p.pid===S.pid);
      var pos=slot(i,z,g[z].length);
      el.style.left=pos.x+'%';el.style.top=pos.y+'%';
      var dying=(!p.alive||p.fl)&&p.dr===V.rd;
      el.classList.toggle('dying',dying);
      if(dying&&p.death){el.querySelector('.bub').textContent=p.death;el.classList.add('showbub')}
      else el.classList.remove('showbub');
    });
  });
  Object.keys(chEls).forEach(function(pid){if(!live[pid]){chEls[pid].remove();delete chEls[pid]}});

  var me=null;V.players.forEach(function(p){if(p.pid===S.pid)me=p});
  var can=me&&me.alive&&V.ph==='question';
  var bO=document.getElementById('pO'),bX=document.getElementById('pX');
  bO.disabled=bX.disabled=!can;
  var mine=S.myChoice||(me&&me.choice);
  bO.setAttribute('aria-pressed',mine==='O');bX.setAttribute('aria-pressed',mine==='X');

  var sb=document.getElementById('sb');
  if(V.ph==='ready')sb.innerHTML='곧 문제가 나옵니다.';
  else if(V.ph==='question'){
    if(!me)sb.innerHTML='관전 중';
    else if(!me.alive)sb.innerHTML='이미 탈락했어요. 남은 친구들을 응원하세요 👀';
    else if(!mine)sb.innerHTML='O 또는 X를 고르세요';
    else{
      var allPicked=V.players.filter(function(p){return p.alive}).every(function(p){return !!p.choice});
      sb.innerHTML=allPicked
        ?'모두 골랐습니다. <b>시간이 다 되면</b> 공개돼요 — 그전까진 바꿀 수 있어요.'
        :'<b>'+mine+'</b> 발판 위에 서 있습니다. 시간 안에 바꿀 수 있어요.';
    }
  }
  else if(V.ph==='reveal')sb.innerHTML=V.mercy?'전원 오답! 심판이 봐줬습니다. 이번 라운드는 <b>무효</b>'
    :'정답은 <b>'+V.ans+'</b>'+(scoreMode?' — 맞힌 사람은 <b>+1점</b>':'');

  var dz=document.getElementById('dz');
  if(V.ph==='reveal'&&V.deaths&&V.deaths.length){
    var dk=V.rd+'|'+V.deaths.length;
    if(dz.getAttribute('data-k')!==dk){          // 매 publish마다 다시 그리면 애니메이션이 끊긴다
      dz.setAttribute('data-k',dk);
      dz.innerHTML='<div class="deaths"><h4>'+(scoreMode?'이번 라운드 오답 ':'이번 라운드 탈락 ')+V.deaths.length+'명</h4><ul>'+
        V.deaths.slice(0,7).map(function(d,i){return '<li style="--i:'+i+'"><b>'+d.emoji+' '+esc(d.name)+
          '</b> <span>— '+esc(d.death)+'</span></li>'}).join('')+
        (V.deaths.length>7?'<li style="--i:7"><span>그 외 '+(V.deaths.length-7)+'명…</span></li>':'')+'</ul></div>';
    }
  }else if(dz.innerHTML){dz.innerHTML='';dz.setAttribute('data-k','')}

  document.getElementById('gv').innerHTML=V.players.filter(function(p){return !p.alive&&p.dr!==V.rd})
    .map(function(p){return '<span class="g" title="'+esc(p.death||'')+'">'+p.emoji+' '+esc(p.name)+'</span>'}).join('');
}
/* ================= 탈락 연출 ================= */
function setSlabFx(){
  var sO=document.getElementById('sO'),sX=document.getElementById('sX');
  if(!sO||!sX)return;
  var isRev=(V.ph==='reveal'&&!!V.ans);
  if(!isRev){
    if(S.fxRd!==null){
      S.fxRd=null;
      [sO,sX].forEach(function(el){el.classList.remove('correct','cracking','broken')});
    }
    return;
  }
  if(S.fxRd===V.rd)return;                       // 이 라운드 연출은 한 번만
  S.fxRd=V.rd;
  var good=(V.ans==='O'?sO:sX),bad=(V.ans==='O'?sX:sO),rd=V.rd;
  good.classList.add('correct');
  if(V.mercy)return;                             // 전원 오답 = 무효, 발판은 버틴다
  bad.classList.add('cracking');                 // 1) 금이 간다
  sfxCrack();
  setTimeout(function(){                         // 2) 0.5초 뒤 두 조각으로 갈라져 추락
    if(S.fxRd!==rd||!bad.isConnected)return;
    bad.classList.remove('cracking');            // rumble 애니메이션을 걷어내야 transition이 먹는다
    bad.classList.add('broken');
    spawnDebris(bad);
    quake();
    sfxThud();
  },500);
}
function quake(){
  if(REDUCED)return;
  var st=document.getElementById('stg');if(!st)return;
  st.classList.remove('quake');void st.offsetWidth;st.classList.add('quake');
  setTimeout(function(){st.classList.remove('quake')},620);
}
function spawnDebris(slabEl){
  if(REDUCED)return;
  var st=document.getElementById('stg');if(!st)return;
  var sr=st.getBoundingClientRect(),br=slabEl.getBoundingClientRect();
  var cx=br.left-sr.left+br.width/2,ty=br.top-sr.top;
  var base=slabEl.id==='sO'?'43,217,196':'255,77,109';
  for(var i=0;i<16;i++){
    var d=document.createElement('i');d.className='debris';
    var sz=4+Math.random()*8;
    d.style.width=sz.toFixed(1)+'px';d.style.height=(sz*.72).toFixed(1)+'px';
    d.style.background='rgba('+base+','+(.35+Math.random()*.5).toFixed(2)+')';
    d.style.left=(cx-18+Math.random()*36).toFixed(1)+'px';
    d.style.top=(ty+br.height*Math.random()).toFixed(1)+'px';
    d.style.setProperty('--dx',((Math.random()*2-1)*95).toFixed(0)+'px');
    d.style.setProperty('--dy',(80+Math.random()*180).toFixed(0)+'px');
    d.style.setProperty('--rot',((Math.random()*2-1)*540).toFixed(0)+'deg');
    d.style.setProperty('--dur',(.7+Math.random()*.6).toFixed(2)+'s');
    st.appendChild(d);
    (function(n){setTimeout(function(){n.remove()},1600)})(d);
  }
}
function confetti(box){
  if(!box||REDUCED)return;
  var cols=['#FFC857','#2BD9C4','#FF4D6D','#EDE9F5','#8E88A8'];
  for(var i=0;i<30;i++){
    var c=document.createElement('i');c.className='conf';
    c.style.left=(Math.random()*100).toFixed(1)+'%';
    c.style.background=cols[i%cols.length];
    c.style.width=(7+Math.random()*5).toFixed(1)+'px';
    c.style.height=(11+Math.random()*8).toFixed(1)+'px';
    c.style.setProperty('--dy',(170+Math.random()*180).toFixed(0)+'px');
    c.style.setProperty('--rot',((Math.random()*2-1)*720).toFixed(0)+'deg');
    c.style.setProperty('--dur',(1.8+Math.random()*1.6).toFixed(2)+'s');
    c.style.setProperty('--del',(Math.random()*1.1).toFixed(2)+'s');
    box.appendChild(c);
  }
  setTimeout(function(){
    var n=box.querySelectorAll('.conf');
    for(var j=0;j<n.length;j++)n[j].remove();
  },4400);
}
function qLabel(dr){var m=/^\d+_(\d+)$/.exec(String(dr||''));return m?'Q'+m[1]:''}
function drOrder(dr){var m=/^\d+_(\d+)$/.exec(String(dr||''));return m?+m[1]:999}

function slot(i,zone,total){
  var cols=zone==='W'?Math.min(6,Math.max(3,total)):4;
  var r=Math.floor(i/cols),c=i%cols;
  if(zone==='W'){var step=Math.min(11,52/cols),w=(cols-1)*step;return{x:50-w/2+c*step,y:74+r*13}}
  var step2=11.5,w2=(Math.min(cols,total)-1)*step2,center=zone==='O'?26:74;
  return{x:center-w2/2+c*step2,y:28+r*21};
}
function choose(c){
  if(!V||V.ph!=='question')return;
  var me=null;V.players.forEach(function(p){if(p.pid===S.pid)me=p});
  if(!me||!me.alive||S.myChoice===c)return;
  S.myChoice=c;paintGame();blip(c==='O'?660:440);
  if(S.isHost)onEvent({t:'pick',pid:S.pid,rd:V.rd,c:c});
  else NET.pub(tEv(),{t:'pick',pid:S.pid,rd:V.rd,c:c});
}
function tickUI(){
  if(!V)return;
  var tf=document.getElementById('tf');if(!tf)return;
  var total=V.ph==='question'?V.tl*1000:V.ph==='reveal'?5200:3400;
  var left=Math.max(0,V.endsAt-(Date.now()+S.offset));
  tf.style.width=Math.max(0,Math.min(100,left/total*100))+'%';
  tf.classList.toggle('warn',V.ph==='question'&&left<4000);
  if(!S.isHost&&S.lastState&&Date.now()-S.lastState>13000){
    connBar.textContent='방장과 연결이 끊겼습니다';connBar.classList.add('show');
  }
}
var ac=null;
function actx(){ac=ac||new (window.AudioContext||window.webkitAudioContext)();return ac}
function tone(f1,f2,dur,type,vol){
  try{var a=actx(),o=a.createOscillator(),g=a.createGain();
    o.type=type||'triangle';o.frequency.setValueAtTime(f1,a.currentTime);
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+dur);
    g.gain.setValueAtTime(vol||.08,a.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);
    o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+dur+.02)}catch(e){}}
function noise(dur,vol,cut){
  try{var a=actx(),n=Math.floor(a.sampleRate*dur),buf=a.createBuffer(1,n,a.sampleRate),d=buf.getChannelData(0);
    for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
    var src=a.createBufferSource();src.buffer=buf;
    var f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=cut||900;
    var g=a.createGain();g.gain.value=vol||.1;
    src.connect(f);f.connect(g);g.connect(a.destination);src.start()}catch(e){}}
function blip(f){tone(f,0,.14,'triangle',.08)}
function sfxCrack(){tone(190,95,.3,'sawtooth',.05);noise(.24,.05,1600)}
function sfxThud(){tone(125,40,.5,'sine',.11);noise(.5,.12,700)}

function renderOver(){
  clearInterval(uiTimer);uiTimer=null;
  var key='over|'+(V.rd||'')+'|'+((V.winner||[]).length);
  if(S.overKey===key&&document.getElementById('lv2'))return;   // 재발행마다 애니메이션 재생 방지
  S.overKey=key;
  var w=V.winner||[],scoreMode=V.mode==='score';
  var body;
  if(scoreMode){
    var ws=w.length?(w[0].score||0):0;
    body=w.length===0?'<div class="av">🤷</div><div class="ttl">무 승 부</div><div class="nm">참가자 없음</div>'
     :w.length===1?'<div class="av">'+w[0].emoji+'</div><div class="ttl">우 승</div><div class="nm">'+esc(w[0].name)+'</div>'+
        '<div class="wsc">'+ws+'문제 정답</div>'
     :'<div class="av">🏆</div><div class="ttl">공 동 우 승 '+w.length+'명</div><div class="nm">'+
        w.map(function(p){return p.emoji+' '+esc(p.name)}).join('  ')+'</div><div class="wsc">'+ws+'문제 정답</div>';
  }else{
    body=w.length===0?'<div class="av">🪦</div><div class="ttl">전 원 탈 락</div><div class="nm">생존자 없음</div>'
     :w.length===1?'<div class="av">'+w[0].emoji+'</div><div class="ttl">최 후 의 생 존 자</div><div class="nm">'+esc(w[0].name)+'</div>'
     :'<div class="av">🏆</div><div class="ttl">공 동 우 승 '+w.length+'명</div><div class="nm">'+
        w.map(function(p){return p.emoji+' '+esc(p.name)}).join('  ')+'</div>';
  }

  var listHtml='';
  if(scoreMode){                                   // 점수전: 전원 순위표 (동점은 같은 등수)
    var rank=V.players.slice().sort(function(a,b){return (b.sc||0)-(a.sc||0)});
    var prevSc=null,prevRank=0;
    listHtml='<div class="rollcall"><h4 class="gold">최종 순위</h4>'+
      rank.map(function(pl,i){
        var sc=pl.sc||0;
        if(sc!==prevSc){prevRank=i+1;prevSc=sc}
        var first=prevRank===1;
        return '<div class="rc'+(first?' top':'')+'" style="--i:'+i+'">'+
          '<div class="rnk">'+prevRank+'</div>'+
          '<div class="av'+(first?' win':'')+'">'+pl.emoji+'</div>'+
          '<div class="txt"><div class="who">'+esc(pl.name)+
            (pl.pid===S.pid?' <span class="mez">나</span>':'')+'</div></div>'+
          '<div class="qn sc">'+sc+'점</div></div>';
      }).join('')+'</div>';
  }else{                                           // 서바이벌: 탈락자 명단
    var dead=V.players.filter(function(pl){return !pl.alive});
    dead.sort(function(a,b){return drOrder(a.dr)-drOrder(b.dr)});   // 먼저 죽은 순서대로 등장
    if(dead.length)listHtml='<div class="rollcall"><h4>탈락자 명단</h4>'+
      dead.map(function(pl,i){
        var qn=qLabel(pl.dr);
        return '<div class="rc" style="--i:'+i+'"><div class="av">'+pl.emoji+'</div>'+
          '<div class="txt"><div class="who">'+esc(pl.name)+'</div>'+
          '<div class="why">'+esc(pl.death||'중도 퇴장')+'</div></div>'+
          (qn?'<div class="qn">'+qn+'</div>':'')+'</div>';
      }).join('')+'</div>';
  }

  app.innerHTML='<div class="winner" id="wcard"><div class="shine"></div>'+body+'</div>'+listHtml+
   '<div class="row" style="margin-top:16px">'+
   (S.isHost?'<button class="btn btn-gold" id="again">한 판 더</button>':'')+
   '<button class="btn btn-ghost" id="lv2">방 나가기</button></div>'+
   (S.isHost?'':'<p class="note">방장이 다시 시작할 때까지 기다려 주세요.</p>');
  document.getElementById('lv2').onclick=leaveRoom;
  var a=document.getElementById('again');
  if(a)a.onclick=function(){chEls={};S.overKey=null;S.fxRd=null;
    G.phase='lobby';G.deaths=[];G.winner=null;G.dirty=true;
    S.screen='lobby';publish(true);render()};
  if(w.length)confetti(document.getElementById('wcard'));
}

window.addEventListener('beforeunload',function(){
  if(S.code){NET.pub(tEv(),{t:'leave',pid:S.pid});if(S.isHost)NET.pub(tState(),null,true)}
});
document.addEventListener('visibilitychange',function(){
  if(!document.hidden&&S.code)NET.pub(tEv(),{t:'hb',pid:S.pid,name:S.name,em:S.emojiIdx});
});

renderHome();
window.__OXREADY__=true;
})();
</script>
