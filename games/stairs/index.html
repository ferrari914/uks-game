<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>무한의 계단 — Englknight</title>
<meta name="description" content="버튼 두 개로 계단을 무한히 오르는 아케이드. 혼자 최고 층수에 도전하거나, 한 명 남을 때까지 겨루는 멀티플레이.">
<meta property="og:title" content="무한의 계단 — Englknight">
<meta property="og:description" content="멈추면 죽는다. 혼자 오르거나, 마지막 한 명이 될 때까지.">
<style>
:root{
  --bg:#0a0b12; --card:#161927; --line:#262b40; --tx:#e8eaf2; --accent:#00e5ff;
  --dim:#9aa3bd; --warn:#ff5470; --ok:#5ee7a0; --gold:#ffd166;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--tx); overflow-x:hidden;
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}

/* ---------- 공통 레이아웃 ---------- */
.wrap{max-width:520px;margin:0 auto;padding:14px 14px calc(24px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:center;gap:10px;min-height:48px}
.hublink{
  display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 14px;
  border:1px solid var(--line);border-radius:12px;background:var(--card);
  color:var(--dim);text-decoration:none;font-size:14px
}
.hublink:active{background:#1d2134}
.grow{flex:1}

h1{font-size:26px;line-height:1.25;margin:14px 0 4px;letter-spacing:-.5px}
h1 .em{color:var(--accent)}
.lead{color:var(--dim);font-size:14px;margin:0 0 14px}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.cardHead{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.cardHead h2{font-size:17px;margin:0}

.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  min-height:52px;padding:0 16px;border:0;border-radius:14px;
  background:var(--accent);color:#04202a;font-weight:800;font-size:16px
}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--tx);font-weight:600}
.btn.warn{background:var(--warn);color:#2a0410}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px}
.row>*{flex:1}

input[type=text]{
  width:100%;min-height:52px;padding:0 14px;border-radius:14px;
  border:1px solid var(--line);background:#0f1220;color:var(--tx);font:inherit
}
input[type=text]:focus{outline:2px solid var(--accent);outline-offset:-2px}
.lbl{display:block;font-size:13px;color:var(--dim);margin:0 0 6px}

/* ---------- 버전 칩 ---------- */
.verwrap{margin:10px 0 2px}
.verchip{
  display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;
  border:1px solid var(--line);border-radius:999px;background:var(--card);
  color:var(--dim);font-size:13px
}
.verchip b{color:var(--accent);font-weight:700}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(6,7,14,.82);display:flex;align-items:flex-end;justify-content:center}
.sheet .vcard{
  width:100%;max-width:520px;max-height:82vh;overflow:auto;background:var(--card);
  border:1px solid var(--line);border-radius:18px 18px 0 0;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom))
}
.ic{
  min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:12px;
  background:transparent;color:var(--dim);font-size:16px
}
.verNow{color:var(--dim);font-size:13px;margin:0 0 10px}
.verNow b{color:var(--tx)}
.verList{list-style:none;margin:0;padding:0}
.verList>li{border-top:1px solid var(--line);padding:10px 0}
.verList h4{margin:0 0 4px;font-size:14px;color:var(--accent)}
.verList ul{margin:0;padding-left:18px;color:var(--dim);font-size:13px}

/* ---------- 모드 선택 ---------- */
.mcard{
  display:block;width:100%;text-align:left;margin:10px 0;padding:16px;
  background:var(--card);border:1px solid var(--line);border-radius:16px;min-height:44px
}
.mcard:active{border-color:var(--accent)}
.mcard h4{margin:0 0 4px;font-size:17px}
.mcard p{margin:0;color:var(--dim);font-size:13px}

/* ---------- 기록 / 명예의 전당 ---------- */
.rec{display:flex;align-items:baseline;gap:8px;border-top:1px solid var(--line);padding:8px 0}
.rec:first-child{border-top:0}
.rec .rk{width:26px;color:var(--dim);font-size:13px;flex:none}
.rec .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec .fl{font-weight:800;color:var(--accent)}
.rec.me{color:var(--gold)}
.rec.me .fl{color:var(--gold)}
.tiny{color:var(--dim);font-size:12px;margin:8px 0 0;line-height:1.5}
.empty{color:var(--dim);font-size:13px;padding:8px 0}
.big{font-size:44px;font-weight:900;letter-spacing:-1px;line-height:1.1}
.big small{font-size:16px;font-weight:700;color:var(--dim);margin-left:4px}

/* ---------- 플레이 화면 ---------- */
.play{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{
  position:relative;z-index:2;
  padding:calc(8px + env(safe-area-inset-top)) 116px 10px 14px;  /* 오른쪽은 소리·나가기 버튼 자리 */
  display:flex;align-items:center;gap:12px;pointer-events:none;
  background:linear-gradient(180deg,rgba(7,8,15,.92),rgba(7,8,15,.55) 70%,rgba(7,8,15,0));
  text-shadow:0 1px 6px rgba(0,0,0,.8)
}
.hud .fl{font-size:32px;font-weight:900;letter-spacing:-1px;line-height:1}
.hud .fl small{font-size:13px;color:var(--dim);font-weight:700;margin-left:3px}
.gwrap{flex:1;display:flex;align-items:center;gap:8px}
.gbar{flex:1;height:14px;border-radius:999px;background:#0f1220;border:1px solid var(--line);overflow:hidden}
.gbar i{display:block;height:100%;width:100%;background:var(--accent);transition:background .2s}
.gbar.low i{background:var(--warn)}
.gpct{font-size:12px;color:var(--dim);width:38px;text-align:right;font-variant-numeric:tabular-nums}
.exit{position:absolute;z-index:3;right:10px;top:calc(8px + env(safe-area-inset-top));
  min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:12px;background:rgba(22,25,39,.8);color:var(--dim)}
.sfxBtn{right:62px;font-size:17px}
.spacer{flex:1}
.pads{position:relative;z-index:2;display:flex;gap:10px;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}
.pad{
  flex:1;min-height:112px;border-radius:18px;border:1px solid var(--line);
  background:rgba(22,25,39,.72);color:var(--tx);font-size:17px;font-weight:800;
  touch-action:none;user-select:none;-webkit-user-select:none
}
.pad:active{background:rgba(0,229,255,.16);border-color:var(--accent)}
.pad small{display:block;font-size:12px;font-weight:600;color:var(--dim);margin-top:4px}
.board{
  position:absolute;z-index:2;right:10px;top:calc(78px + env(safe-area-inset-top));
  width:150px;background:rgba(16,18,32,.86);border:1px solid var(--line);border-radius:14px;padding:8px 10px
}
.board h5{margin:0 0 6px;font-size:11px;color:var(--dim);font-weight:700;letter-spacing:.5px}
.board .b{display:flex;gap:6px;font-size:12px;line-height:1.7}
.board .b .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .b .f{font-weight:800;font-variant-numeric:tabular-nums}
.board .b.dead{color:#5c637d}
.board .b.dead .f{color:#5c637d}
.board .b.me .n{color:var(--accent)}
.count{
  position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;
  font-size:96px;font-weight:900;color:var(--accent);text-shadow:0 0 40px rgba(0,229,255,.5)
}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom));
  z-index:70;background:#1d2134;border:1px solid var(--line);border-radius:12px;
  padding:10px 16px;font-size:14px;max-width:90vw
}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;background:#0f1220;border:1px solid var(--line);font-size:12px;color:var(--dim)}
.code{font-size:32px;font-weight:900;letter-spacing:6px;color:var(--accent);text-align:center;margin:6px 0}
.plist{list-style:none;margin:8px 0 0;padding:0}
.plist li{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding:8px 0;font-size:14px}
.plist li .host{font-size:11px;color:var(--gold)}
.st{font-size:12px;color:var(--dim)}
.st b{color:var(--ok)}
.st.off b{color:var(--warn)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<div id="toast"></div>
<script>
/* =========================================================================
   무한의 계단 (Englknight)  —  games/stairs/index.html
   스펙: games/stairs/SPEC.md
   classic script만 쓴다 (file:// 더블클릭에서 열려야 하므로 ES 모듈 금지).
   외부 의존은 mqtt.js CDN 하나뿐이고, 그것도 멀티·명예의 전당에서만 불러온다.
   플레이 중에는 네트워크를 전혀 건드리지 않는다.
   ========================================================================= */

/* ---------- 버전 정보 ---------- */
var VERSION='1.4.0';
var CHANGELOG=[
 {v:'1.4.0',t:['계단을 2D 평면으로 바꿨다 — 모든 칸이 같은 크기, 같은 간격',
               '깊이는 배경이 맡는다: 성운·별·행성은 그대로',
               '화면 가장자리로 밀려난 계단은 흐려진다']},
 {v:'1.3.0',t:['명예의 전당을 영구 보존 저장소로 옮겼다 — 기록이 더는 사라지지 않는다',
               '고도에 따라 하늘이 변한다 — 대기권 → 우주 → 성운 → 은하 띠 → 은하 중심',
               '내 최고 기록 층에 표식이 선다. 넘어서면 알려준다',
               '100층마다 이정표 계단에 층수가 새겨진다',
               '체력이 바닥나면 화면 가장자리가 붉게 맥동한다',
               '빨리 오를수록 별이 선으로 늘어난다',
               '한 칸 오를 때마다 발밑에 빛 파문이 퍼진다',
               '아주 가끔 인공위성이 지나간다',
               '소리가 생겼다 — 발소리·방향 전환·이정표·신기록·사망. 오른쪽 위 버튼으로 끈다']},
 {v:'1.2.0',t:['우주로 배경을 바꿨다 — 성운, 3겹으로 흐르는 별, 먼 행성',
               '가끔 유성이 지나간다',
               '주인공이 우주비행사가 됐다 — 금색 바이저가 바라보는 방향이다',
               '계단 앞 모서리가 형광으로 빛나 어두운 우주에서도 잘 보인다']},
 {v:'1.1.0',t:['게임 화면을 입체적으로 다시 그렸다 — 위로 갈수록 계단이 작아지는 원근',
               '멀리 있는 계단은 배경색으로 바래게 해 높이가 실감나도록',
               '별이 층수에 따라 다른 속도로 흐르는 배경 (그림 파일은 쓰지 않는다)',
               '한 칸 오를 때 캐릭터가 튀어오르고 착지에서 눌리는 동작',
               '벽에 부딪히거나 힘이 다하면 파편이 흩어지는 연출']},
 {v:'1.0.0',t:['무한의 계단 첫 공개 — 버튼 2개(오르기 / 방향 전환)로 계단을 무한히 오른다',
               '싱글플레이: 최고 층수 기록과 명예의 전당(전체 순위표)',
               '멀티플레이: 2~8인이 같은 계단을 동시에 올라 한 명 남을 때까지 경쟁',
               '체력 게이지 — 멈추면 줄고, 한 칸 오를 때마다 회복. 높이 오를수록 빨리 준다']}
];

/* ---------- 튜닝 (손맛은 전부 여기서 조정한다) ----------
   기준점(사용자 확정): 300층에서 1초 망설이면 게이지 절반이 날아간다.
     D(f) = d0 + span * ∛( min(1, f/capFloor) )   [%/초]
     D(300) = 22 + 53*∛(0.15) = 50.2 %/초  ← 기준 충족
   회복량 recover 는 전 구간 "유지에 필요한 속도"를 한 번에 움직이는 손잡이다.
   감소만 올리고 회복을 낮게 두면 사람이 칠 수 없는 속도가 되므로 같이 잡아야 한다. */
var TUNE={
  gaugeMax:100,
  recover:12,        // 한 칸 오를 때마다 회복 (%)
  d0:22,             // 0층 초당 감소 (%)
  span:53,           // 상한까지의 증가폭 → 2000층에서 75 %/초
  capFloor:2000,     // 이 층부터 감소량 고정
  turnProb:0.5,      // 다음 계단이 방향을 바꿀 확률
  stepAnim:90        // 한 칸 이동 연출 시간 (ms) — 입력을 막지는 않는다
};

/* ---------- 잡동사니 ---------- */
function $(s){return document.querySelector(s)}
function esc(s){return String(s).replace(/[&<>"']/g,function(m){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
function rid(n){var c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',s='';
  for(var i=0;i<n;i++)s+=c[Math.floor(Math.random()*c.length)];return s}
function cleanName(s){
  var t=String(s||'').replace(/[^0-9A-Za-z가-힣ㄱ-ㅎㅏ-ㅣ ]/g,'').trim().slice(0,8);
  return t||'익명';
}
function nowMs(){return Date.now()}
var REDUCED=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);

/* 시드 난수 — 멀티에서 전원이 같은 계단을 오르기 위해 쓴다 */
function mulberry32(a){
  return function(){
    a|=0; a=a+0x6D2B79F5|0;
    var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}

/* localStorage 는 사파리 프라이빗 등에서 던질 수 있다 — 전부 감싼다 */
var store={
  get:function(k,d){try{var v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},
  set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}
};
/* =========================================================================
   소리 — 파일 없이 합성한다 (Web Audio)
   음원 파일을 넣으면 file:// 요건과 "게임당 파일 하나" 관례가 깨지고 로딩도 생긴다.
   짧은 발음 몇 개라 오실레이터로 충분하다.
   브라우저는 사용자가 화면을 건드리기 전엔 소리를 못 내게 막으므로,
   AudioContext 는 첫 입력 때 만들어진다.
   ========================================================================= */
var SFX=(function(){
  var ac=null, on=(store.get('stairs.sound','1')==='1');
  function ctx(){
    if(ac)return ac;
    var C=window.AudioContext||window.webkitAudioContext;
    if(!C)return null;
    try{ac=new C()}catch(e){ac=null}
    return ac;
  }
  function beep(freq,dur,type,vol,slide){
    if(!on)return;
    var a=ctx(); if(!a)return;
    if(a.state==='suspended'){try{a.resume()}catch(e){}}
    var t=a.currentTime, o=a.createOscillator(), g=a.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(freq,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,slide),t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.09,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t+dur+0.02);
  }
  function noise(dur,vol){
    if(!on)return;
    var a=ctx(); if(!a)return;
    var n=Math.max(1,Math.floor(a.sampleRate*dur)), buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0);
    for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);      // 뒤로 갈수록 잦아든다
    var src=a.createBufferSource(); src.buffer=buf;
    var g=a.createGain(); g.gain.value=vol||0.10;
    src.connect(g); g.connect(a.destination); src.start();
  }
  return {
    isOn:function(){return on},
    toggle:function(){
      on=!on; store.set('stairs.sound',on?'1':'0');
      if(on)beep(880,0.07,'sine',0.07);
      return on;
    },
    step:function(){beep(520,0.045,'triangle',0.055)},
    turn:function(){beep(392,0.055,'triangle',0.055,466)},
    mile:function(){beep(784,0.10,'sine',0.075);setTimeout(function(){beep(1047,0.16,'sine',0.075)},90)},
    record:function(){[659,831,988,1319].forEach(function(f,i){setTimeout(function(){beep(f,0.15,'sine',0.085)},i*95)})},
    wall:function(){beep(150,0.22,'square',0.09,60);noise(0.18,0.09)},
    fade:function(){beep(420,0.55,'sine',0.075,90)},
    go:function(){beep(660,0.12,'sine',0.08)}
  };
})();

function getNick(){return store.get('stairs.nick','')}
function setNick(v){store.set('stairs.nick',v)}

/* 내 기록 — 오프라인에서도 항상 동작하는 주력 기록 */
function myRecords(){
  try{var a=JSON.parse(store.get('stairs.recs','[]'));return (a instanceof Array)?a:[]}catch(e){return []}
}
function addRecord(floor,mode){
  var a=myRecords();
  a.push({f:floor,m:mode||'single',t:nowMs()});
  a.sort(function(x,y){return y.f-x.f});
  a=a.slice(0,5);
  store.set('stairs.recs',JSON.stringify(a));
  return a;
}
function bestFloor(){var a=myRecords();return a.length?a[0].f:0}

/* ---------- 토스트 ---------- */
var toastT=null;
function toast(msg){
  var el=$('#toast');
  el.innerHTML='<div class="toast">'+esc(msg)+'</div>';
  if(toastT)clearTimeout(toastT);
  toastT=setTimeout(function(){el.innerHTML=''},2600);
}

/* ---------- mqtt.js 지연 로딩 ---------- */
var MQTT_CDN=['https://unpkg.com/mqtt@5.14.1/dist/mqtt.min.js',
              'https://cdn.jsdelivr.net/npm/mqtt@5.14.1/dist/mqtt.min.js'];
function loadMqtt(){
  return new Promise(function(res,rej){
    if(window.mqtt)return res();
    var i=0;
    (function next(){
      if(i>=MQTT_CDN.length)return rej(new Error('mqtt-load'));
      var sc=document.createElement('script');
      sc.src=MQTT_CDN[i++]; sc.onload=function(){res()}; sc.onerror=next;
      document.head.appendChild(sc);
    })();
  });
}

/* =========================================================================
   명예의 전당 (전체 순위표)  —  Firebase Realtime Database (REST)
   2026-09-01 이관. 이전에는 공용 MQTT 브로커의 retain 메시지를 슬롯 10개로 썼는데,
   그 브로커는 테스트용이라 주기적으로 비워져 기록이 사흘을 못 넘겼다.

   SDK도 API 키도 쓰지 않는다 — fetch 하나면 된다. 외부 스크립트를 안 불러와야
   file:// 요건과 "게임당 파일 하나" 관례가 유지된다.
   (Origin: null 로도 CORS 가 열려 있어 file:// 에서도 호출된다 — 실측 확인)

   서버 규칙이 강제하는 것:
     · {name: 1~12자, score: 0~99999999 정수, ts: 숫자} 형식을 벗어나면 거부
     · 추가만 되고 **수정·삭제는 아무도 못 한다** — 남의 기록을 지울 수 없게 하려는 것
   그래서 슬롯을 덮어쓰던 예전 방식은 통째로 걷어냈다. 순위표 길이 제약도 사라졌다.
   ========================================================================= */
var HOF_URL='https://tetris260827-30fe0-default-rtdb.asia-southeast1.firebasedatabase.app/ranking/stairs.json';
var HOF_TOP=20;

var HOF=(function(){
  var state='idle', list=null, waiters=[];
  function finish(ok,l){
    state=ok?'on':'fail'; list=ok?l:null;
    var w=waiters; waiters=[];
    w.forEach(function(fn){fn(list)});
  }
  return {
    load:function(cb){
      if(state==='on')return cb(list);
      waiters.push(cb);
      if(state==='loading')return;
      state='loading';
      var done=false;
      var to=setTimeout(function(){if(!done){done=true;finish(false)}},9000);
      fetch(HOF_URL+'?orderBy=%22score%22&limitToLast='+HOF_TOP,{cache:'no-store'})
        .then(function(r){if(!r.ok)throw new Error('http');return r.json()})
        .then(function(o){
          if(done)return; done=true; clearTimeout(to);
          var a=[];
          if(o)Object.keys(o).forEach(function(k){
            var e=o[k];
            if(e&&typeof e.score==='number')
              a.push({n:cleanName(e.name),f:Math.floor(e.score),t:+e.ts||0});
          });
          a.sort(function(x,y){return y.f-x.f||x.t-y.t});
          finish(true,a);
        })['catch'](function(){
          if(done)return; done=true; clearTimeout(to); finish(false);
        });
    },
    ready:function(){return state==='on'},
    invalidate:function(){state='idle';list=null},
    submit:function(name,floor,cb){
      var body={name:cleanName(name).slice(0,12),score:Math.floor(floor),ts:nowMs()};
      if(!(body.score>0))return cb(false);
      fetch(HOF_URL,{method:'POST',headers:{'Content-Type':'application/json'},
                     body:JSON.stringify(body)})
        .then(function(r){cb(!!r.ok)})['catch'](function(){cb(false)});
    }
  };
})();

/* =========================================================================
   게임 엔진
   계단은 L(-1) / R(+1) 방향의 무한 수열이다. 시드가 같으면 계단도 같다.
   판단 규칙: 다음 계단이 지금 방향과 같으면 [오르기], 반대면 [방향 전환].
   ========================================================================= */
function makeGame(seed){
  var rnd=mulberry32(seed>>>0);
  var dirs=[0];                        // dirs[i] = i번째 칸으로 가는 방향
  function dir(i){
    while(dirs.length<=i){
      /* 첫 칸은 항상 정면이다. 시작하자마자 방향 전환을 요구하면
         아직 화면을 못 읽은 상태에서 억울하게 죽는다. */
      dirs.push(dirs.length===1?1:(rnd()<TUNE.turnProb?-1:1));
    }
    return dirs[i];
  }
  var xs=[0];
  function xAt(i){
    while(xs.length<=i)xs.push(xs[xs.length-1]+dir(xs.length));
    return xs[i];
  }
  var G={
    floor:0, facing:1, gauge:TUNE.gaugeMax,
    started:false, dead:false, why:'', deadAt:0, wallSide:0,
    mark:0, markHit:false,        // 내 최고 기록 층 — 오르는 중에 목표가 보이게 한다
    dir:dir, xAt:xAt
  };
  G.drain=function(){                  // 지금 층의 초당 감소량 (%)
    return TUNE.d0+TUNE.span*Math.cbrt(Math.min(1,G.floor/TUNE.capFloor));
  };
  G.die=function(why){
    if(G.dead)return;
    G.dead=true; G.why=why; G.deadAt=nowMs(); G.gauge=0;
  };
  /* act: 'up' | 'turn'.  애니메이션이 돌든 말든 즉시 처리한다 — 입력을 막지 않는다. */
  G.act=function(a){
    if(G.dead)return false;
    var d=dir(G.floor+1);
    var want=(d===G.facing)?'up':'turn';
    if(a!==want){ G.wallSide=G.facing; G.die('wall'); return false }
    if(a==='turn')G.facing=d;
    G.floor++; xAt(G.floor);
    G.gauge=Math.min(TUNE.gaugeMax,G.gauge+TUNE.recover);
    if(!G.started){G.started=true;G.tickAt=nowMs()}
    return true;
  };
  /* 게이지는 프레임이 아니라 "실제 시계"로 닳는다.
     requestAnimationFrame 은 탭이 숨겨지면 멈춘다 — 프레임에 물려두면
     탭을 옮겨둔 동안 게이지가 얼어붙어 안 죽는다. 그건 이 게임의 규칙이 아니다. */
  G.tickAt=0;
  G.advance=function(now){
    if(!G.started||G.dead)return;
    if(!G.tickAt){G.tickAt=now;return}
    var dt=(now-G.tickAt)/1000;
    G.tickAt=now;
    if(dt<=0)return;
    G.gauge-=G.drain()*dt;
    if(G.gauge<=0){G.gauge=0;G.die('gauge')}
  };
  return G;
}

/* =========================================================================
   렌더러 (캔버스 2D)  —  이미지 파일은 한 장도 쓰지 않는다
   플레이어를 화면 62% 높이에 고정하고 카메라가 따라 오른다.

   계단은 **2D 평면**으로 그린다 (2026-09-02 사용자 확정, 이전에는 3D 원근이었다).
   모든 칸이 같은 크기·같은 간격이고, 멀다고 바래지지도 않는다.
   깊이는 계단이 아니라 **배경**이 담당한다 — 성운·별 3겹 시차·먼 행성.
   계단 자체는 조명(윗면 밝음 / 앞면 어두움)과 형광 띠로만 읽힌다.

   그리고 층수 자체가 보상이 되도록, **고도에 따라 하늘이 변한다.**
   0층은 대기권(푸른빛), 120층부터 우주, 500층부터 성운이 짙어지고,
   1200층부터 은하 띠가, 2000층부터 은하 중심이 보인다.
   ========================================================================= */
function makeView(cv,G){
  var ctx=cv.getContext('2d'), dpr=1, W=0, H=0;
  var camX=0, camY=0, first=true;
  var sw=46, sh=34;
  var stars=null, parts=[], lastT=0, stepT=0, seenFloor=-1, deadSpawned=false;
  var meteors=[], nextMeteor=0, sats=[], nextSat=0, rings=[];
  var spd=0, lastStepAt=0;                 // 초당 몇 칸 오르는가 (별을 늘리는 데 쓴다)
  var bgCv=null, bgAtFloor=-9999;

  function resize(){
    dpr=Math.min(2,window.devicePixelRatio||1);
    W=cv.clientWidth; H=cv.clientHeight;
    cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    var k=Math.min(1.25,Math.max(.78,W/390));
    sw=46*k; sh=34*k;
    bgAtFloor=-9999;                        // 크기가 바뀌면 배경을 다시 그린다
  }
  window.addEventListener('resize',resize);

  /* ---- 색 ---- */
  function rgb(h){return [parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)]}
  function mix(a,b,t){
    return 'rgb('+((a[0]+(b[0]-a[0])*t)|0)+','+((a[1]+(b[1]-a[1])*t)|0)+','+((a[2]+(b[2]-a[2])*t)|0)+')';
  }
  function lerpHex(h1,h2,t){var a=rgb(h1),b=rgb(h2);return mix(a,b,t)}

  /* 우주는 어둡다. 계단 앞 모서리에 형광 띠를 둘러야
     "다음 계단이 어느 쪽인가"가 유지된다 — 여기서 대비를 포기하면 게임이 망가진다. */
  var C_TOP=rgb('#2e3a63'), C_LIP=rgb('#7fd8ff'), C_FRONT=rgb('#0f1424'),
      C_EDGE=rgb('#3a4a7a'), C_FOG=rgb('#070713');
  var C_MILE_TOP=rgb('#1d5f6b'), C_MILE_LIP=rgb('#5ef0d0');     // 100층 이정표
  var C_BEST_TOP=rgb('#6b5320'), C_BEST_LIP=rgb('#ffd166');     // 내 최고 기록

  /* ---- 고도별 하늘 ---- */
  var SKY=[
    {f:0,    a:'#123a63', b:'#0a1c3a', c:'#050b1a', neb:0.10, atm:0.60, band:0, core:0},
    {f:120,  a:'#0b0a1e', b:'#070713', c:'#04040b', neb:0.30, atm:0.00, band:0, core:0},
    {f:500,  a:'#180a30', b:'#0a0720', c:'#050310', neb:0.60, atm:0,    band:0, core:0},
    {f:1200, a:'#1f0a34', b:'#0d0722', c:'#060312', neb:0.85, atm:0,    band:0.55, core:0},
    {f:2000, a:'#2c0f3e', b:'#150828', c:'#080316', neb:1.00, atm:0,    band:1, core:1}
  ];
  function sky(f){
    var i=0;
    while(i<SKY.length-1&&f>=SKY[i+1].f)i++;
    if(i>=SKY.length-1)return SKY[SKY.length-1];
    var A=SKY[i], B=SKY[i+1], t=(f-A.f)/(B.f-A.f);
    t=t<0?0:t>1?1:t;
    return {a:lerpHex(A.a,B.a,t), b:lerpHex(A.b,B.b,t), c:lerpHex(A.c,B.c,t),
            neb:A.neb+(B.neb-A.neb)*t, atm:A.atm+(B.atm-A.atm)*t,
            band:A.band+(B.band-A.band)*t, core:A.core+(B.core-A.core)*t};
  }
  /* 성운·행성·은하는 매 프레임 다시 만들 필요가 없다. 오프스크린에 그려두고 복사하되,
     고도가 25층쯤 바뀌면 다시 그린다 — 하늘이 서서히 변하는 게 보이도록. */
  function paintBackdrop(f){
    var S=sky(f);
    bgCv=document.createElement('canvas');
    bgCv.width=Math.max(1,Math.round(W)); bgCv.height=Math.max(1,Math.round(H));
    var b=bgCv.getContext('2d');
    var g=b.createLinearGradient(0,0,0,H);
    g.addColorStop(0,S.a); g.addColorStop(0.5,S.b); g.addColorStop(1,S.c);
    b.fillStyle=g; b.fillRect(0,0,W,H);
    if(S.band>0.02){                                  // 은하 띠 — 비스듬히 가로지른다
      b.save(); b.translate(W*0.5,H*0.45); b.rotate(-0.62);
      var bg2=b.createLinearGradient(0,-H*0.16,0,H*0.16);
      bg2.addColorStop(0,'rgba(0,0,0,0)');
      bg2.addColorStop(0.5,'rgba(190,170,255,'+(0.14*S.band).toFixed(3)+')');
      bg2.addColorStop(1,'rgba(0,0,0,0)');
      b.fillStyle=bg2; b.fillRect(-W,-H*0.16,W*2,H*0.32); b.restore();
    }
    var neb=[[0.22,0.24,'#5b2ea8',0.30],[0.78,0.42,'#1a6b8f',0.24],[0.45,0.72,'#8f2a6b',0.18]];
    for(var i=0;i<neb.length;i++){
      var n=neb[i], nx=n[0]*W, ny=n[1]*H, rad=Math.max(W,H)*0.55;
      var rg=b.createRadialGradient(nx,ny,0,nx,ny,rad);
      rg.addColorStop(0,n[2]); rg.addColorStop(1,'rgba(0,0,0,0)');
      b.globalAlpha=n[3]*S.neb; b.fillStyle=rg; b.fillRect(0,0,W,H);
    }
    b.globalAlpha=1;
    if(S.core>0.02){                                  // 은하 중심 — 아주 높은 곳에서만
      var cg=b.createRadialGradient(W*0.5,H*0.34,0,W*0.5,H*0.34,Math.min(W,H)*0.5);
      cg.addColorStop(0,'rgba(255,236,200,'+(0.30*S.core).toFixed(3)+')');
      cg.addColorStop(0.4,'rgba(220,150,255,'+(0.12*S.core).toFixed(3)+')');
      cg.addColorStop(1,'rgba(0,0,0,0)');
      b.fillStyle=cg; b.fillRect(0,0,W,H);
    }
    if(S.atm>0.02){                                   // 대기권 — 아래쪽에서 지구가 빛난다
      var ag=b.createLinearGradient(0,H,0,H*0.45);
      ag.addColorStop(0,'rgba(90,170,255,'+(0.34*S.atm).toFixed(3)+')');
      ag.addColorStop(1,'rgba(90,170,255,0)');
      b.fillStyle=ag; b.fillRect(0,H*0.45,W,H*0.55);
    }
    bgAtFloor=f;
  }

  /* ---- 별 ---- */
  function mkStars(){
    var rnd=mulberry32(20260901), a=[];
    var L=[[110,0.9,0.22,0.08],[60,1.5,0.45,0.20],[26,2.4,0.85,0.42]];
    for(var i=0;i<L.length;i++)
      for(var j=0;j<L[i][0];j++)
        a.push({x:rnd(),y:rnd(),s:L[i][1],b:L[i][2]*(0.4+rnd()*0.6),d:L[i][3],cross:i===2&&rnd()<0.35});
    stars=a;
  }
  function drawStars(){
    if(!stars)mkStars();
    /* 빨리 오를수록 별이 선으로 늘어난다 — 속도가 눈에 보이게 */
    var stretch=Math.min(26,spd*3.4);
    for(var i=0;i<stars.length;i++){
      var st=stars[i];
      var y=((st.y*H + camY*sh*st.d) % H + H) % H, x=st.x*W;
      var hgt=st.s+stretch*st.d*2.4;
      ctx.fillStyle='rgba(214,228,255,'+st.b.toFixed(2)+')';
      ctx.fillRect(x,y,st.s,hgt);
      if(st.cross&&stretch<4){
        ctx.fillStyle='rgba(214,228,255,'+(st.b*0.45).toFixed(2)+')';
        ctx.fillRect(x-st.s*1.6,y+st.s*0.35,st.s*4.2,st.s*0.3);
        ctx.fillRect(x+st.s*0.35,y-st.s*1.6,st.s*0.3,st.s*4.2);
      }
    }
  }
  function drawPlanet(){
    var pr=Math.min(W,H)*0.17, pcx=W*0.80;
    var pcy=H*0.17 + ((camY*sh*0.035)%(H*1.6));
    if(pcy>H+pr)pcy-=H*1.6;
    var pg=ctx.createRadialGradient(pcx-pr*0.4,pcy-pr*0.4,pr*0.1,pcx,pcy,pr);
    pg.addColorStop(0,'#6d7fb8'); pg.addColorStop(0.55,'#2d3560'); pg.addColorStop(1,'#12142a');
    ctx.beginPath();ctx.arc(pcx,pcy,pr,0,6.3);ctx.fillStyle=pg;ctx.fill();
    ctx.strokeStyle='rgba(160,190,255,.22)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(pcx,pcy,pr,0,6.3);ctx.stroke();
  }
  /* ---- 유성 ---- */
  function meteorsTick(now,dt){
    if(REDUCED)return;
    if(!nextMeteor)nextMeteor=now+2500+Math.random()*5000;
    if(now>nextMeteor){
      var fromLeft=Math.random()<0.5;
      meteors.push({x:fromLeft?-70:W+70,y:Math.random()*H*0.55,
        vx:(fromLeft?1:-1)*(560+Math.random()*420),vy:210+Math.random()*180,
        age:0,life:1.1+Math.random()*0.5,len:70+Math.random()*90});
      nextMeteor=now+4500+Math.random()*9000;
    }
    for(var i=meteors.length-1;i>=0;i--){
      var m=meteors[i]; m.age+=dt;
      if(m.age>=m.life){meteors.splice(i,1);continue}
      m.x+=m.vx*dt; m.y+=m.vy*dt;
      var k=Math.sqrt(m.vx*m.vx+m.vy*m.vy), tx=m.x-m.vx/k*m.len, ty=m.y-m.vy/k*m.len;
      var a=Math.sin(Math.min(1,m.age/m.life)*Math.PI);
      var lg=ctx.createLinearGradient(m.x,m.y,tx,ty);
      lg.addColorStop(0,'rgba(255,255,255,'+(0.9*a).toFixed(2)+')');
      lg.addColorStop(0.35,'rgba(160,214,255,'+(0.42*a).toFixed(2)+')');
      lg.addColorStop(1,'rgba(160,214,255,0)');
      ctx.strokeStyle=lg;ctx.lineWidth=2.1;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(m.x,m.y);ctx.lineTo(tx,ty);ctx.stroke();
      ctx.lineCap='butt';
    }
  }
  /* ---- 인공위성 — 유성보다 훨씬 드물게, 천천히 ---- */
  function satsTick(now,dt){
    if(REDUCED)return;
    if(!nextSat)nextSat=now+25000+Math.random()*40000;
    if(now>nextSat){
      var fromLeft=Math.random()<0.5;
      sats.push({x:fromLeft?-60:W+60,y:H*(0.10+Math.random()*0.42),
        vx:(fromLeft?1:-1)*(26+Math.random()*18),vy:(Math.random()-0.5)*8,
        s:Math.min(W,H)*0.050, t:0});
      nextSat=now+60000+Math.random()*90000;
    }
    for(var i=sats.length-1;i>=0;i--){
      var v=sats[i]; v.t+=dt; v.x+=v.vx*dt; v.y+=v.vy*dt;
      if(v.x<-140||v.x>W+140){sats.splice(i,1);continue}
      var s=v.s, d=v.vx>0?1:-1;
      ctx.save();
      if(!REDUCED){ctx.shadowColor='rgba(150,190,255,.5)';ctx.shadowBlur=8}
      ctx.fillStyle='#cdd8f2'; ctx.fillRect(v.x-s*0.5,v.y-s*0.36,s,s*0.72);   // 본체
      ctx.restore();
      ctx.fillStyle='#5b8ede';                                                // 태양 전지판
      ctx.fillRect(v.x-s*2.2,v.y-s*0.26,s*1.6,s*0.52);
      ctx.fillRect(v.x+s*0.6,v.y-s*0.26,s*1.6,s*0.52);
      ctx.fillStyle='#8fb2ea';                                                // 전지판 격자
      ctx.fillRect(v.x-s*2.2,v.y-s*0.03,s*1.6,s*0.06);
      ctx.fillRect(v.x+s*0.6,v.y-s*0.03,s*1.6,s*0.06);
      ctx.fillRect(v.x-s*1.4,v.y-s*0.26,s*0.06,s*0.52);
      ctx.fillRect(v.x+s*1.4,v.y-s*0.26,s*0.06,s*0.52);
      ctx.fillStyle='rgba(190,215,255,.8)';                                   // 지지대·안테나
      ctx.fillRect(v.x-s*0.62,v.y-s*0.04,s*1.24,s*0.08);
      ctx.fillRect(v.x+d*s*0.5,v.y-s*0.5,s*0.06*d,s*0.5);
      if((v.t%1.6)<0.35){                                                     // 깜빡이는 등
        ctx.save();
        if(!REDUCED){ctx.shadowColor='#ff6b6b';ctx.shadowBlur=10}
        ctx.fillStyle='#ff6b6b';
        ctx.beginPath();ctx.arc(v.x+d*s*0.5,v.y-s*0.56,s*0.15,0,6.3);ctx.fill();
        ctx.restore();
      }
    }
  }
  function bg(now,dt,floor){
    if(!bgCv||bgCv.width!==Math.round(W)||Math.abs(floor-bgAtFloor)>25)paintBackdrop(floor);
    ctx.drawImage(bgCv,0,0);
    drawStars(); drawPlanet();
    satsTick(now,dt); meteorsTick(now,dt);
  }

  /* ---- 계단 한 칸 ---- */
  function block(x,y,sc,fog,kind,label){
    var top=C_TOP, lip=C_LIP;
    if(kind===2){top=C_BEST_TOP;lip=C_BEST_LIP}
    else if(kind===1){top=C_MILE_TOP;lip=C_MILE_LIP}
    var bw=sw*1.02*sc, topH=Math.max(6,sh*0.38*sc), bodyH=Math.max(4,(sh+3)*sc);
    var l=Math.round(x-bw/2), w=Math.max(2,Math.round(bw));
    ctx.fillStyle=mix(C_FRONT,C_FOG,fog);
    ctx.fillRect(l,y,w,bodyH);
    ctx.fillStyle=mix(top,C_FOG,fog);
    ctx.fillRect(l,y-topH,w,topH);
    ctx.fillStyle=mix(lip,C_FOG,fog);
    ctx.fillRect(l,y-Math.max(1,2*sc),w,Math.max(1,2*sc));
    if(sc>0.45){
      ctx.strokeStyle=mix(C_EDGE,C_FOG,fog); ctx.lineWidth=1;
      ctx.strokeRect(l+.5,Math.round(y-topH)+.5,w-1,Math.round(topH+bodyH)-1);
    }
    if(label){
      ctx.fillStyle='rgba(255,255,255,0.72)';
      ctx.font='700 '+Math.round(10*sc)+'px system-ui,sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(label,x,y+bodyH*0.42);
      ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    }
  }

  /* ---- 캐릭터: 우주비행사 ----
     방향은 두 겹으로 알린다 — ①금색 바이저가 앞으로 치우쳐 있고
     ②등짐이 뒤로 튀어나와 실루엣이 비대칭이다. 하나만으론 작은 화면에서 안 읽힌다. */
  function hero(x,y,facing,dead,anim){
    var s=sw*0.42, f=facing;
    var hop=dead?0:Math.sin(anim*Math.PI), sq=1-0.14*hop, st=1+0.14*hop;
    y-=hop*sh*0.22;
    var suit=dead?'#6b7085':'#eef2ff', belt=dead?'#4e5468':'#c3cbe6',
        pack=dead?'#565b6e':'#9aa6c8', visor=dead?'#8a6a2a':'#ffb703';
    ctx.save();
    if(!dead&&!REDUCED){ctx.shadowColor='rgba(190,215,255,.45)';ctx.shadowBlur=14}
    ctx.fillStyle=pack;
    ctx.fillRect(x-f*s*0.86,y-s*1.60*st,s*0.44*(f>0?1:-1),s*0.86*st);
    ctx.fillStyle=dead?'#454a5c':'#7f8cb0';
    ctx.fillRect(x-f*s*0.86,y-s*1.24*st,s*0.44*(f>0?1:-1),s*0.10);
    ctx.fillStyle=suit;
    ctx.beginPath();
    ctx.moveTo(x-f*s*0.46*sq,y);
    ctx.lineTo(x-f*s*0.46*sq,y-s*1.42*st);
    ctx.lineTo(x+f*s*0.52*sq,y-s*1.42*st);
    ctx.lineTo(x+f*s*0.46*sq,y-s*0.2*st);
    ctx.lineTo(x+f*s*0.46*sq,y);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle=belt;
    ctx.fillRect(x-f*s*0.46*sq,y-s*0.34*st,s*0.92*sq*(f>0?1:-1),s*0.16);
    ctx.fillStyle=suit;
    ctx.beginPath(); ctx.arc(x,y-s*2.12*st,s*0.62*sq,0,Math.PI*2); ctx.fill();
    ctx.restore();
    ctx.fillStyle=visor;
    ctx.beginPath();
    ctx.ellipse(x+f*s*0.20,y-s*2.14*st,s*0.40*sq,s*0.34*sq,0,0,Math.PI*2);
    ctx.fill();
    if(!dead){
      ctx.fillStyle='rgba(255,255,255,.6)';
      ctx.beginPath(); ctx.arc(x+f*s*0.34,y-s*2.26*st,s*0.12,0,Math.PI*2); ctx.fill();
    }
  }

  /* ---- 착지 파문 ----
     화면 좌표가 아니라 "그 계단"에 매달아야 한다. 고정 좌표에 그리면
     카메라가 따라오는 동안 파문만 제자리에 남아 발밑에서 떨어진다. */
  function ringsTick(dt,baseY,cx){
    for(var i=rings.length-1;i>=0;i--){
      var r=rings[i]; r.age+=dt;
      var p=r.age/0.28;
      if(p>=1){rings.splice(i,1);continue}
      var rr=r.f-camY, rsc=scaleAt(rr);
      var rx=cx+(r.x-camX)*sw*rsc, ry=baseY-yOff(rr);
      ctx.strokeStyle='rgba(127,216,255,'+((1-p)*0.55).toFixed(2)+')';
      ctx.lineWidth=Math.max(1,2.2*(1-p));
      ctx.beginPath();
      ctx.ellipse(rx,ry,sw*rsc*(0.25+p*0.72),sh*rsc*(0.10+p*0.28),0,0,Math.PI*2);
      ctx.stroke();
    }
  }
  /* ---- 죽을 때 파편 ---- */
  function spawnParts(x,y,gold){
    if(REDUCED)return;
    var rnd=mulberry32((G.floor*7919+13)>>>0);
    for(var i=0;i<(gold?26:16);i++){
      var a=rnd()*Math.PI*2, sp=(40+rnd()*(gold?210:150));
      parts.push({x:x,y:y-sh*0.6,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-(gold?150:90),
        s:2+rnd()*3.5,life:0.55+rnd()*0.45,age:0,gold:!!gold});
    }
  }
  function partsTick(dt){
    for(var i=parts.length-1;i>=0;i--){
      var p=parts[i]; p.age+=dt;
      if(p.age>=p.life){parts.splice(i,1);continue}
      p.vy+=520*dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
      var al=(1-p.age/p.life).toFixed(2);
      ctx.fillStyle=p.gold?'rgba(255,209,102,'+al+')':'rgba(214,228,255,'+al+')';
      ctx.fillRect(p.x,p.y,p.s,p.s);
    }
  }
  /* ---- 게이지가 바닥나면 화면 가장자리가 붉게 맥동한다 ----
     색만으로 알리지 않는다 — HUD의 % 숫자는 그대로 있다. */
  function lowGaugeVignette(now){
    if(G.dead)return;
    var g=G.gauge;
    if(g>32)return;
    var sev=1-g/32;
    var pulse=REDUCED?0.55:(0.45+0.55*Math.abs(Math.sin(now/(150+g*12))));
    var vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.28,W/2,H/2,Math.max(W,H)*0.72);
    vg.addColorStop(0,'rgba(255,60,90,0)');
    vg.addColorStop(1,'rgba(255,40,70,'+(0.52*sev*pulse).toFixed(3)+')');
    ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  }

  return {
    resize:resize,
    ripple:function(){                         // 한 칸 올랐을 때 발밑에서 퍼진다
      if(REDUCED)return;
      rings.push({f:G.floor,x:G.xAt(G.floor),age:0});
      if(rings.length>6)rings.shift();
    },
    burst:function(){spawnParts(W/2,H*0.62,true)},   // 신기록 돌파
    draw:function(){
      if(!W||!H)resize();
      var now=nowMs(), dt=lastT?Math.min(0.05,(now-lastT)/1000):0; lastT=now;
      if(G.floor!==seenFloor){
        if(seenFloor>=0&&lastStepAt){          // 오르는 속도를 부드럽게 추적
          var inst=1000/Math.max(60,now-lastStepAt);
          spd+=(inst-spd)*0.35;
        }
        lastStepAt=now; seenFloor=G.floor; stepT=now;
      }else if(lastStepAt&&now-lastStepAt>260){
        spd+=(0-spd)*Math.min(1,dt*3.2);       // 멈추면 다시 줄어든다
      }
      var anim=Math.min(1,(now-stepT)/110);

      var tx=G.xAt(G.floor), ty=G.floor;
      if(first){camX=tx;camY=ty;first=false}
      else{
        /* 프레임당 고정 비율로 따라가면 120Hz 화면에서 카메라가 두 배로 빨라진다.
           경과 시간 기준으로 환산해야 어느 기기에서나 같은 속도로 따라온다. */
        var k=REDUCED?1:(1-Math.pow(1-0.28,Math.max(0.001,dt)*60));
        if(k>1)k=1;
        camX+=(tx-camX)*k; camY+=(ty-camY)*k;
      }
      bg(now,dt,G.floor);

      var baseY=H*0.62, cx=W/2;
      var lo=Math.max(0,G.floor-7), hi=G.floor+18;   // 평면에선 이 위는 화면 밖이다
      var mark=G.mark||0;
      for(var i=hi;i>=lo;i--){
        var r=i-camY, sc=scaleAt(r), sy=baseY-yOff(r);
        if(sy<-80||sy>H+80)continue;
        var sx=cx+(G.xAt(i)-camX)*sw*sc;
        /* 원근이 없으면 멀리 있는 칸이 중앙으로 모이지 않는다 — 계단이 좌우로
           드리프트해 화면 끝에서 뭉텅 잘린다. 가장자리에서 흐려지게 해 잘린 단면을
           감춘다. (3D 시절엔 공기원근이 이 일을 했다) */
        var edge=Math.abs(sx-cx)/(W*0.5);
        var al=edge<0.66?1:Math.max(0,1-(edge-0.66)/0.30);
        if(al<=0.02)continue;
        ctx.globalAlpha=al;
        var kind=0,label=null;
        if(mark&&i===mark){kind=2;label='최고'}
        else if(i>0&&i%100===0){kind=1;label=String(i)}
        block(sx,sy,sc,0,kind,label);
        ctx.globalAlpha=1;
      }
      ringsTick(dt,baseY,cx);
      var hr=G.floor-camY, hsc=scaleAt(hr);
      var hx=cx+(G.xAt(G.floor)-camX)*sw*hsc, hy=baseY-yOff(hr);
      hero(hx,hy,G.facing,G.dead,anim);
      if(G.dead&&!deadSpawned){deadSpawned=true;spawnParts(hx,hy,false)}
      if(!G.dead)deadSpawned=false;
      if(parts.length)partsTick(dt);
      if(G.dead&&G.why==='wall'){
        ctx.font='700 '+Math.round(sw*0.62)+'px system-ui,sans-serif';
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('💥',hx+G.wallSide*sw*0.8,hy-sh*0.9);
        ctx.textAlign='left'; ctx.textBaseline='alphabetic';
      }
      lowGaugeVignette(now);
    }
  };
  /* 2D 평면 — 배율은 항상 1이고 간격도 일정하다.
     (3D 원근 시절에는 여기서 1/(1+r·k) 와 그 적분을 썼다) */
  function scaleAt(r){return 1}
  function yOff(r){return r*sh}
}

/* =========================================================================
   통신 계층 (멀티 전용) — OX 서바이벌의 3중 브로커 폴백을 그대로 가져왔다.
   공용 브로커는 IP당 연결 제한·주기적 강제 절단이 흔하다. mqtt.js의 reconnectPeriod는
   "같은 브로커"만 무한 재시도하므로 한 번 거부당하면 영영 못 붙는다. 그래서 절단 후
   STALL_MS 안에 복귀하지 못하면 현재 클라이언트를 버리고 다음 브로커로 승격한다.

   여기서 오가는 값은 층수와 생존 여부뿐이다. 둘 다 원래 전원에게 공개되는 정보라
   암호화할 것이 없다 — crypto.subtle 을 쓰지 않으므로 file:// 에서도 동작한다.
   ========================================================================= */
var BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081/mqtt'];
var CONNECT_MS=8000, STALL_MS=12000, MAX_ROUNDS=3;

function makeNet(){
  var cl=null,subs={},bi=0,rounds=0,stallT=null,notify=null,dead=false,pendRes=null,pendRej=null;
  function setState(x){if(notify)notify(x)}
  function clearStall(){if(stallT){clearTimeout(stallT);stallT=null}}
  function armStall(){if(stallT||dead)return;
    stallT=setTimeout(function(){stallT=null;promote()},STALL_MS)}
  function promote(){
    if(dead)return;
    clearStall();
    /* 탭이 숨겨져 있으면 브라우저가 타이머를 조여 keepalive가 밀린다.
       그 상태의 "끊김"은 브로커 탓이 아니므로 갈아타지 말고 다시 지켜본다. */
    if(document.hidden){armStall();return}
    var old=cl; cl=null;
    try{old&&old.end(true)}catch(e){}
    open();
  }
  function giveUp(){
    setState('dead');
    if(pendRej){var r=pendRej;pendRes=pendRej=null;r(new Error('broker'))}
  }
  function open(){
    if(dead)return;
    if(bi>=BROKERS.length){bi=0;rounds++}
    if(rounds>=MAX_ROUNDS)return giveUp();
    var url=BROKERS[bi++];
    var c=window.mqtt.connect(url,{clientId:'st_'+Math.random().toString(16).slice(2,10),
      clean:true,reconnectPeriod:2500,connectTimeout:7000,keepalive:30});
    var settled=false;
    var to=setTimeout(function(){
      if(settled)return; settled=true;
      try{c.end(true)}catch(e){} open();
    },CONNECT_MS);
    c.on('connect',function(){
      settled=true;clearTimeout(to);clearStall();
      cl=c;rounds=0;
      Object.keys(subs).forEach(function(t){c.subscribe(t,{qos:0})});
      setState('on');
      if(pendRes){var r=pendRes;pendRes=pendRej=null;r(url)}
    });
    c.on('error',function(){
      if(settled)return; settled=true;
      clearTimeout(to);try{c.end(true)}catch(e){} open();
    });
    c.on('close',  function(){if(cl===c){setState('off');armStall()}});
    c.on('offline',function(){if(cl===c){setState('off');armStall()}});
    c.on('reconnect',function(){if(cl===c){setState('re');armStall()}});
    c.on('message',function(t,p){
      if(cl!==c)return;                               // 버린 클라이언트의 잔여 메시지 무시
      var fn=subs[t]; if(!fn)return;
      var v=p.toString();
      try{fn(v?JSON.parse(v):null)}catch(e){}
    });
  }
  return {
    connect:function(onState){
      notify=onState;
      if(cl)return Promise.resolve('');
      return loadMqtt().then(function(){
        return new Promise(function(res,rej){
          pendRes=res;pendRej=rej;bi=0;rounds=0;dead=false;open();
        });
      });
    },
    rescan:function(){if(!dead&&cl)promote()},
    sub:function(t,fn){subs[t]=fn;if(cl)cl.subscribe(t,{qos:0})},
    pub:function(t,o){if(cl)cl.publish(t,JSON.stringify(o),{qos:0})},
    end:function(){dead=true;clearStall();try{cl&&cl.end(true)}catch(e){}cl=null;subs={}}
  };
}

function hofCardHtml(){

  return recRows(l);
}
function loadHof(after){
  if(S.hof.state==='on')return after&&after();
  S.hof.state='loading'; after&&after();

    S.hof.state=list?'on':'fail';
    S.hof.list=list;
    after&&after();
  });
}

function wirePads(onAct,onExit){
  function bind(el,act){
    if(!el)return;
    el.addEventListener('pointerdown',function(e){e.preventDefault();onAct(act)},{passive:false});
    el.addEventListener('contextmenu',function(e){e.preventDefault()});
  }
  bind($('#padUp'),'up');
  bind($('#padTurn'),'turn');
  $('#exitBtn').onclick=onExit;
  var sb=$('#sfxBtn');
  if(sb)sb.onclick=function(){sb.textContent=SFX.toggle()?'🔊':'🔇'};
  document.onkeydown=function(e){
    if(e.repeat)return;
    var k=e.key.toLowerCase();
    if(k==='z'||k==='arrowup'){e.preventDefault();onAct('up')}
    else if(k==='x'||k==='arrowleft'||k==='arrowright'){e.preventDefault();onAct('turn')}
  };
}
function unwirePads(){document.onkeydown=null}

function paintHud(){
  var f=$('#fNum'); if(!f)return;
  f.textContent=G.floor;
  var pct=Math.max(0,Math.round(G.gauge));
  var fill=$('#gFill'); if(fill)fill.style.width=pct+'%';
  var bar=$('#gBar'); if(bar){
    if(pct<=30)bar.classList.add('low'); else bar.classList.remove('low');
  }
  var p=$('#gPct'); if(p)p.textContent=pct+'%';
}
/* 한 칸 올릴 때 따라붙는 것들 — 소리·파문·이정표·신기록.
   규칙은 G.act 가 정하고, 여기는 그 결과에 반응만 한다. */
function actFx(a){
  if(!G||G.dead)return;
  var before=G.floor;
  var ok=G.act(a);
  if(!ok){ if(G.dead)SFX.wall(); return }
  if(V)V.ripple();
  if(a==='turn')SFX.turn(); else SFX.step();
  if(G.floor%100===0)SFX.mile();
  if(G.mark&&!G.markHit&&before<G.mark&&G.floor>=G.mark){
    G.markHit=true;
    SFX.record();
    if(V)V.burst();
    toast('신기록! 여기서부터는 처음 밟는 계단입니다');
  }
}

function stopLoop(){if(rafId){cancelAnimationFrame(rafId);rafId=0}}
function startLoop(onFrame){
  stopLoop();
  (function frame(){
    rafId=requestAnimationFrame(frame);
    onFrame();
  })();
}

/* =========================================================================
   싱글플레이
   ★ 플레이 중에는 네트워크를 전혀 건드리지 않는다. 명예의 전당은 죽은 뒤에만 부른다.

function startSingle(){
  S.screen='single'; S.mode='single';

  $('#app').innerHTML=playHtml(false);
  V=makeView($('#cv'),G); V.resize();
  wirePads(function(a){
    if(G.dead)return;
    actFx(a);
    if(G.dead)setTimeout(endSingle,650);
  },function(){ quitPlay(renderHome) });
  startLoop(function(){
    G.advance(nowMs());
    V.draw(); paintHud();
    if(G.dead&&!G._ended){G._ended=1;if(G.why==='gauge')SFX.fade();setTimeout(endSingle,650)}
  });
  /* 탭이 숨겨져 RAF가 멈춰도 게이지는 계속 닳아야 한다 */
  clearInterval(tickT);
  tickT=setInterval(function(){
    if(S.screen!=='single'||!G)return;
    G.advance(nowMs());
    if(G.dead&&!G._ended){G._ended=1;if(G.why==='gauge')SFX.fade();setTimeout(endSingle,650)}
  },500);
}
function quitPlay(then){
  stopLoop(); unwirePads(); clearInterval(tickT); tickT=0; G=null; V=null; then();
}

/* =========================================================================
   멀티 — 대기실
   방장 권한은 대기실과 시작 신호까지만이다. 시작한 뒤에는 각자의 죽음을 본인만
   보고하고 다툴 여지가 없으므로, 모든 클라이언트가 같은 상태에서 승자를 독립적으로
   계산할 수 있다 — 그래서 방장이 나가도 경기는 끝나지 않는다.
   ========================================================================= */
function netLabel(){
  var m={idle:'연결 중…',on:'연결됨',off:'끊김 — 복구 중',re:'재연결 중…',dead:'연결 실패'};
  return m[S.netState]||'…';
}
function enterRoom(code,isHost){
  S.code=code; S.isHost=isHost; S.peers={}; S.roster=null; S.gid=''; S.over=null;
  S.screen='room'; S.hostSeen=0; S.hostPs=null; S.scans=0;
  location.hash=code;
  renderRoom();
  if(!S.net)S.net=makeNet();
  S.net.connect(function(st){S.netState=st;paintRoomState()}).then(function(){
    S.netState='on';
    S.net.sub(tP(),onMsg);
    pumpLobby();
    paintRoomState();
  })['catch'](function(){
    S.netState='dead'; paintRoomState();
  });
}
function leaveRoom(){
  if(S.net){try{S.net.pub(tP(),{t:'bye',pid:S.pid})}catch(e){}
    S.net.end(); S.net=null}
  clearInterval(hbT); hbT=0;
  clearInterval(tickT); tickT=0;
  stopLoop(); unwirePads();
  S.code=''; S.peers={}; S.roster=null; S.over=null; G=null; V=null;
  try{location.hash=''}catch(e){}
}
function pumpLobby(){
  clearInterval(hbT);
  hbT=setInterval(function(){
    if(!S.net)return;
    if(S.screen==='room'){
      S.net.pub(tP(),{t:'hi',pid:S.pid,n:S.name});
      if(S.isHost)S.net.pub(tP(),{t:'room',host:S.pid,ps:lobbyList()});
      /* 방장을 못 찾으면 다른 브로커에 방이 있을 수 있다 — OX와 같은 훑기 */
      if(!S.isHost&&!S.hostPs&&nowMs()-(S.enteredAt||0)>6000&&S.scans<3){
        S.scans++; S.enteredAt=nowMs(); S.net.rescan(); paintRoomState();
      }
      paintRoomList();
    }
  },1200);
  S.enteredAt=nowMs();
  if(S.net){
    S.net.pub(tP(),{t:'hi',pid:S.pid,n:S.name});
    if(S.isHost)S.net.pub(tP(),{t:'room',host:S.pid,ps:lobbyList()});
  }
}
function lobbyList(){
  var out=[{pid:S.pid,n:S.name}], t=nowMs();
  Object.keys(S.peers).forEach(function(k){
    var p=S.peers[k];
    if(k!==S.pid&&t-p.seen<5000&&out.length<8)out.push({pid:k,n:p.n});
  });
  return out;
}
function roomPlayers(){
  if(S.isHost)return lobbyList();
  return S.hostPs||[{pid:S.pid,n:S.name}];
}
function renderRoom(){
  S.screen='room';
  var res=S.over?resultHtml():'';
  $('#app').innerHTML=
  '<div class="wrap">'+
    '<div class="topbar"><button class="hublink" id="out" aria-label="방에서 나가기">← 나가기</button>'+
      '<div class="grow"></div><span class="st" id="netSt">·</span></div>'+
    verChip()+
    res+
    '<h1>대기실</h1>'+
    '<div class="card"><div class="cardHead"><h2>방 코드</h2></div>'+
      '<div class="code">'+esc(S.code)+'</div>'+
      '<button class="btn ghost" id="copy">초대 링크 복사</button>'+
      '<ul class="plist" id="plist"></ul>'+
    '</div>'+
    (S.isHost?
      '<button class="btn" id="start">시작하기</button>'+
      '<p class="tiny">2명 이상 모이면 시작할 수 있습니다.</p>'
      :'<p class="tiny">방장이 시작하기를 누르면 함께 출발합니다.</p>')+
  '</div>';
  wireVer();
  $('#out').onclick=function(){leaveRoom();renderHome()};
  $('#copy').onclick=function(){
    var l=inviteLink();
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(l).then(function(){toast('초대 링크를 복사했습니다')},
        function(){toast(l)});
    }else toast(l);
  };
  var sb=$('#start');
  if(sb)sb.onclick=hostStart;
  paintRoomState(); paintRoomList();
}
function paintRoomState(){
  var el=$('#netSt'); if(!el)return;
  el.className='st'+(S.netState==='on'?'':' off');
  el.innerHTML='<b>●</b> '+esc(netLabel())+
    (!S.isHost&&!S.hostPs&&S.netState==='on'?' · 방 찾는 중':'');
}
function paintRoomList(){
  var ul=$('#plist'); if(!ul)return;
  var ps=roomPlayers(), host=S.isHost?S.pid:(S.hostPid||'');
  ul.innerHTML=ps.map(function(p){
    return '<li>'+esc(p.n)+(p.pid===host?' <span class="host">방장</span>':'')+
      (p.pid===S.pid?' <span class="pill">나</span>':'')+'</li>';
  }).join('');
  var sb=$('#start');
  if(sb)sb.disabled=(ps.length<2);
}
function hostStart(){
  var ps=lobbyList();
  if(ps.length<2)return toast('2명 이상 있어야 시작합니다');
  var gid=rid(6), seed=(Math.random()*4294967296)>>>0;
  var msg={t:'go',gid:gid,seed:seed,ps:ps};
  /* 공용 브로커에서 한 번은 흘릴 수 있다 — 짧게 세 번 보낸다 (gid로 중복 무시) */
  S.net.pub(tP(),msg);
  setTimeout(function(){S.net&&S.net.pub(tP(),msg)},250);
  setTimeout(function(){S.net&&S.net.pub(tP(),msg)},550);
  beginMulti(msg);
}

/* ---------- 메시지 수신 ---------- */
function onMsg(m){
  if(!m||!m.t)return;
  var t=nowMs();
  if(m.t==='hi'){
    if(m.pid===S.pid)return;
    var p=S.peers[m.pid]||(S.peers[m.pid]={n:'',f:0,a:1,seen:0});
    p.n=cleanName(m.n); p.seen=t;
    return;
  }
  if(m.t==='room'){
    if(m.host===S.pid)return;
    S.hostPid=m.host; S.hostPs=(m.ps||[]).slice(0,8); S.hostSeen=t;
    if(S.screen==='room'){paintRoomList();paintRoomState()}
    return;
  }
  if(m.t==='go'){
    if(m.gid===S.gid)return;                 // 같은 판의 재전송
    if(S.screen!=='room')return;             // 이미 경기 중이면 무시
    var mine=(m.ps||[]).some(function(p){return p.pid===S.pid});
    if(!mine)return;                         // 내가 낀 판이 아니다
    beginMulti(m);
    return;
  }
  if(m.t==='s'){
    if(m.pid===S.pid)return;
    var q=S.peers[m.pid]||(S.peers[m.pid]={n:'',f:0,a:1,seen:0});
    q.n=cleanName(m.n||q.n);
    if(typeof m.f==='number'&&m.f>q.f)q.f=Math.floor(m.f);
    if(m.a===0)q.a=0;
    q.seen=t;
    return;
  }
  if(m.t==='bye'){
    var b=S.peers[m.pid];
    if(b){b.a=0;b.seen=t-99999}
    if(S.screen==='room')paintRoomList();
    return;
  }
}

/* =========================================================================
   멀티 — 경기
   ========================================================================= */
var PUB_MS=400;        // 층수 발행 주기. 순위표가 1초여도 게임은 성립하지만,
                       // "지금 누가 몇 층인지"의 긴박감이 이 게임의 재미라 너무 늦추지 않는다.
var GONE_MS=6000;      // 이만큼 소식이 없으면 이탈로 보고 탈락 처리한다

function beginMulti(msg){
  S.gid=msg.gid; S.seed=msg.seed>>>0; S.roster=(msg.ps||[]).slice(0,8); S.over=null;
  S.mode='multi'; S.screen='play';
  var t=nowMs();
  S.peers={}; S.deadSeq={}; S.deadN=0;
  S.roster.forEach(function(p){
    if(p.pid!==S.pid)S.peers[p.pid]={n:cleanName(p.n),f:0,a:1,seen:t};
  });
  G=makeGame(S.seed);
  $('#app').innerHTML=playHtml(true)+'<div class="count" id="cnt">3</div>';
  V=makeView($('#cv'),G); V.resize();
  paintHud(); paintBoard(); V.draw();
  wirePads(function(a){
    if(!S.running||G.dead)return;
    actFx(a);
    if(G.dead)onMyDeath();
  },function(){ leaveRoom(); renderHome() });

  S.running=false;
  var n=3;
  var cd=setInterval(function(){
    n--;
    var el=$('#cnt');
    if(!el){clearInterval(cd);return}
    if(n>0)el.textContent=String(n);
    else{
      clearInterval(cd);
      el.parentNode.removeChild(el);
      SFX.go();
      runMulti();
    }
  },800);
}
function onMyDeath(){
  /* 죽는 순간에는 즉시 알린다 — 순위표가 400ms 늦게 갱신되면 억울하다 */
  pubState(); setTimeout(pubState,180);
  var pads=document.querySelector('.pads');
  if(pads)pads.innerHTML='<div class="pad" style="display:flex;align-items:center;justify-content:center;opacity:.75">'+
    '관전 중 · 내 기록 <b style="color:var(--accent);margin:0 4px">'+G.floor+'층</b></div>';
  unwirePads();
  var ex=$('#exitBtn'); if(ex)ex.onclick=function(){leaveRoom();renderHome()};
}
function pubState(){
  if(!S.net||!G)return;
  S.net.pub(tP(),{t:'s',pid:S.pid,n:S.name,f:G.floor,a:G.dead?0:1});
}
/* 누가 먼저 떨어졌는지 기록해 둔다. 이게 없으면 결과 화면이
   "4층이 1등, 20층이 2등"으로 보여 규칙을 오해하게 된다. */
function markDead(pid){
  if(!S.deadSeq)S.deadSeq={};
  if(!S.deadSeq[pid])S.deadSeq[pid]=(++S.deadN||(S.deadN=1));
}
function multiStates(){
  var t=nowMs(), out=[];
  if(!S.deadSeq){S.deadSeq={};S.deadN=0}
  (S.roster||[]).forEach(function(p){
    if(p.pid===S.pid){
      var al=!!(G&&!G.dead);
      if(!al)markDead(S.pid);
      out.push({pid:S.pid,n:S.name,f:G?G.floor:0,alive:al,me:true});
    }else{
      var q=S.peers[p.pid];
      if(!q)q={n:cleanName(p.n),f:0,a:1,seen:t};
      var gone=(t-q.seen)>GONE_MS;
      var al2=!!q.a&&!gone;
      if(!al2)markDead(p.pid);
      out.push({pid:p.pid,n:q.n||cleanName(p.n),f:q.f,alive:al2,me:false,gone:gone&&!!q.a});
    }
  });
  out.sort(function(a,b){
    if(a.alive!==b.alive)return a.alive?-1:1;      // 살아 있는 사람이 위
    if(a.alive)return b.f-a.f;                      // 생존자끼리는 높이 순
    var da=S.deadSeq[a.pid]||0, db=S.deadSeq[b.pid]||0;
    return db-da;                                   // 늦게 떨어진 사람이 위
  });
  return out;
}
function paintBoard(){
  var el=$('#board'); if(!el)return;
  var st=multiStates(), alive=0;
  st.forEach(function(x){if(x.alive)alive++});
  el.innerHTML='<h5>생존 '+alive+' / '+st.length+'</h5>'+
    st.map(function(x){
      return '<div class="b'+(x.alive?'':' dead')+(x.me?' me':'')+'">'+
        '<span class="n">'+esc(x.n)+'</span><span class="f">'+x.f+'</span></div>';
    }).join('');
}
function runMulti(){
  S.running=true;
  clearInterval(tickT);
  tickT=setInterval(function(){
    if(S.screen!=='play')return;
    G.advance(nowMs());
    if(G.dead&&!G._ended){G._ended=1;if(G.why==='gauge')SFX.fade();onMyDeath()}
    pubState();
    paintBoard();
    checkEnd();
  },PUB_MS);
  startLoop(function(){
    G.advance(nowMs());
    if(G.dead&&!G._ended){G._ended=1;if(G.why==='gauge')SFX.fade();onMyDeath()}
    V.draw(); paintHud();
  });
}
function checkEnd(){
  if(S.screen!=='play')return;
  var st=multiStates(), alive=st.filter(function(x){return x.alive});
  if(alive.length>1)return;
  finishMulti(st,alive);
}
function finishMulti(st,alive){
  S.running=false;
  clearInterval(tickT); tickT=0;
  stopLoop(); unwirePads();
  pubState();
  var winners;
  if(alive.length===1)winners=[alive[0]];
  else{
    /* 동시 탈락 — 최종 층수가 높은 쪽이 우승, 층수까지 같으면 공동 우승 */
    var top=0;
    st.forEach(function(x){if(x.f>top)top=x.f});
    winners=st.filter(function(x){return x.f===top});
  }
  if(G)addRecord(G.floor,'multi');
  S.over={
    st:st.slice(),
    winners:winners.map(function(w){return {n:w.n,f:w.f,me:w.me}}),
    myFloor:G?G.floor:0
  };
  S.screen='mover';
  renderMultiOver();
}
function resultHtml(){
  if(!S.over)return '';
  var o=S.over;
  var iWon=o.winners.some(function(w){return w.me});
  return '<div class="card">'+
    '<div class="cardHead"><h2>'+(iWon?'🏆 우승했습니다':'경기 결과')+'</h2></div>'+
    '<p class="lead" style="margin:0 0 8px">'+
      (o.winners.length>1?'공동 우승 — ':'우승 — ')+
      esc(o.winners.map(function(w){return w.n}).join(', '))+
      ' <span class="pill">'+o.winners[0].f+'층</span></p>'+
    '<p class="tiny" style="margin:0 0 8px">순위는 <b>오래 버틴 순</b>입니다 — 층수 순이 아닙니다. '+
    '더 높이 올라갔어도 먼저 떨어지면 아래에 놓입니다.</p>'+
    o.st.map(function(x,i){
      return '<div class="rec'+(x.me?' me':'')+'"><span class="rk">'+(i+1)+'</span>'+
        '<span class="nm">'+esc(x.n)+(x.me?' (나)':'')+
          (x.alive?' <span class="pill">생존</span>':'')+'</span>'+
        '<span class="fl">'+x.f+'층</span></div>';
    }).join('')+
  '</div>';
}
function renderMultiOver(){
  $('#app').innerHTML=
  '<div class="wrap">'+
    '<div class="topbar"><button class="hublink" id="out" aria-label="첫 화면으로 돌아가기">← 첫 화면</button>'+
      '<div class="grow"></div><span class="st" id="netSt">·</span></div>'+
    verChip()+
    '<h1>경기 종료</h1>'+
    resultHtml()+
    '<div class="row"><button class="btn" id="lobby">대기실로</button>'+
      '<button class="btn ghost" id="out2">첫 화면</button></div>'+
    '<div class="card"><div class="cardHead"><h2>🏅 내 기록</h2></div>'+myRecHtml()+'</div>'+
  '</div>';
  wireVer();
  paintRoomState();
  $('#out').onclick=function(){leaveRoom();renderHome()};
  $('#out2').onclick=function(){leaveRoom();renderHome()};
  $('#lobby').onclick=function(){
    S.gid=''; G=null; V=null;
    renderRoom(); pumpLobby();
  };
}

/* =========================================================================
   부팅
   ========================================================================= */
window.addEventListener('hashchange',function(){});
/* 탭을 떠난 동안에도 게이지는 실제 시계로 닳는다 (G.advance).
   돌아왔을 때 이미 죽어 있으면 그대로 결과로 넘어간다 — 멈추면 죽는다. */
renderHome();
</script>
