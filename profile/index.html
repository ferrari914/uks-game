<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 캐릭터 — Englknight</title>
<meta name="description" content="나만의 아바타를 꾸미는 캐릭터 프로필">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧙</text></svg>">
<!-- 허브와 같은 팔레트·포커스·모션 규칙을 그대로 쓴다 -->
<link rel="stylesheet" href="../assets/style.css">
<style>
  .pf-back {
    display: inline-flex; align-items: center; gap: var(--s2);
    min-height: var(--tap);
    color: var(--muted); text-decoration: none;
    font-size: 14px; font-weight: 600;
  }
  .pf-back:hover { color: var(--text); }

  .pf-head { text-align: center; padding: var(--s4) 0 var(--s6); }
  .pf-head h1 {
    font-size: clamp(28px, 6vw, 44px); font-weight: 900; letter-spacing: -1px;
    background: linear-gradient(120deg, var(--accent), #a78bfa 55%, var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .pf-head p { margin-top: var(--s2); color: var(--muted); font-size: 14px; }

  .pf-layout {
    display: grid; grid-template-columns: minmax(280px, 380px) 1fr;
    gap: var(--s6); align-items: start; padding-bottom: var(--s8);
  }

  /* ===== 왼쪽: 아바타 + 신상 ===== */
  .pf-stage {
    background: linear-gradient(180deg, var(--card-2), var(--card));
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: var(--s4); position: sticky; top: var(--s4);
  }
  .pf-avatar {
    width: 100%; display: block; border-radius: var(--s3);
    background: var(--bg); overflow: hidden;
  }
  .pf-avatar svg { display: block; width: 100%; height: auto; }

  .pf-namerow { margin-top: var(--s4); }
  .pf-namerow label { display: block; font-size: 12px; color: var(--muted); margin-bottom: var(--s1); }
  .pf-name {
    width: 100%; min-height: var(--tap);
    background: var(--bg-2); border: 1px solid var(--line);
    border-radius: var(--s3); padding: var(--s2) var(--s3);
    color: var(--text); font-size: 16px; font-weight: 700; font-family: inherit;
    text-align: center; outline: none;
    transition: border-color .18s, box-shadow .18s;
  }
  .pf-name:focus-visible {
    border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,229,255,.14); outline: none;
  }

  /* 확장 대비 자리만 잡아둔 영역 — 값은 아직 연동되지 않는다 */
  .pf-slots { margin-top: var(--s4); border-top: 1px dashed var(--line); padding-top: var(--s4); }
  .pf-slotrow { display: flex; justify-content: space-between; gap: var(--s3); font-size: 13px; padding: var(--s1) 0; }
  .pf-slotrow dt { color: var(--muted); }
  .pf-slotrow dd { color: var(--muted-2); font-variant-numeric: tabular-nums; }
  .pf-soon {
    margin-top: var(--s3); font-size: 12px; color: var(--muted-2);
    background: rgba(255,255,255,.03); border: 1px dashed var(--line);
    border-radius: var(--s2); padding: var(--s2) var(--s3); text-align: center;
  }

  /* ===== 오른쪽: 꾸미기 ===== */
  .pf-editor {
    background: linear-gradient(180deg, var(--card-2), var(--card));
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: var(--s4);
  }
  .pf-tabs {
    display: flex; gap: var(--s2); flex-wrap: wrap;
    border-bottom: 1px solid var(--line); padding-bottom: var(--s4);
  }
  .pf-tab {
    min-height: var(--tap); padding: var(--s2) var(--s4);
    background: var(--bg-2); border: 1px solid var(--line); border-radius: 999px;
    color: var(--muted); font-size: 14px; font-family: inherit; cursor: pointer;
    transition: color .18s, border-color .18s, background .18s;
  }
  .pf-tab:hover { color: var(--text); border-color: var(--line-2); }
  .pf-tab[aria-selected="true"] {
    background: var(--accent); border-color: var(--accent);
    color: #06121a; font-weight: 700;
  }

  .pf-section { padding-top: var(--s4); }
  .pf-section h2 { font-size: 12px; color: var(--muted); font-weight: 700; margin-bottom: var(--s3); }
  .pf-section + .pf-section { border-top: 1px solid var(--line); margin-top: var(--s4); }

  .pf-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: var(--s2); }
  .pf-item {
    background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--s3);
    padding: var(--s2); cursor: pointer; font-family: inherit;
    display: flex; flex-direction: column; align-items: center; gap: var(--s1);
    color: var(--muted); font-size: 12px;
    transition: border-color .18s, background .18s, color .18s;
  }
  .pf-item:hover { border-color: var(--line-2); color: var(--text); }
  .pf-item[aria-pressed="true"] {
    border-color: var(--accent); color: var(--text);
    background: rgba(0,229,255,.08);
  }
  .pf-item svg, .pf-item .pf-chipbg {
    width: 100%; aspect-ratio: 1 / 1; border-radius: var(--s2);
    background: var(--bg); display: block;
  }

  .pf-colors { display: flex; flex-wrap: wrap; gap: var(--s2); }
  .pf-color {
    width: var(--tap); height: var(--tap); border-radius: 50%;
    border: 2px solid var(--line); cursor: pointer; padding: 0;
    transition: border-color .18s, transform .18s;
  }
  .pf-color:hover { border-color: var(--line-2); }
  .pf-color[aria-pressed="true"] { border-color: var(--accent); transform: scale(1.08); }

  .pf-actions {
    display: flex; gap: var(--s2); flex-wrap: wrap;
    margin-top: var(--s6); border-top: 1px solid var(--line); padding-top: var(--s4);
  }
  .pf-btn {
    min-height: var(--tap); padding: var(--s2) var(--s6);
    background: var(--card-2); border: 1px solid var(--line-2); border-radius: 999px;
    color: var(--text); font-size: 14px; font-family: inherit; cursor: pointer;
    transition: border-color .18s, background .18s;
  }
  .pf-btn:hover { background: var(--line); border-color: var(--accent); }

  .pf-saved { margin-left: auto; align-self: center; font-size: 12px; color: var(--muted-2); }

  @media (max-width: 860px) {
    .pf-layout { grid-template-columns: 1fr; gap: var(--s4); }
    .pf-stage { position: static; }
    .pf-avatar { max-width: 320px; margin: 0 auto; }
  }
</style>
</head>
<body>

<a class="skip" href="#editor">꾸미기 패널로 건너뛰기</a>

<div class="wrap">

  <p><a class="pf-back" href="../index.html"><span aria-hidden="true">←</span> 허브로 돌아가기</a></p>

  <div class="pf-head">
    <h1>내 캐릭터</h1>
    <p>아바타를 꾸미면 이 기기에 자동으로 저장됩니다.</p>
  </div>

  <main class="pf-layout">

    <section class="pf-stage" aria-labelledby="stageTitle">
      <h2 id="stageTitle" class="sr-only">아바타 미리보기</h2>
      <div class="pf-avatar" id="avatar"></div>

      <div class="pf-namerow">
        <label for="nickname">닉네임</label>
        <input id="nickname" class="pf-name" type="text" maxlength="12"
               placeholder="이름 없는 모험가" autocomplete="off">
      </div>

      <div class="pf-slots">
        <dl>
          <div class="pf-slotrow"><dt>레벨</dt><dd id="slotLevel">—</dd></div>
          <div class="pf-slotrow"><dt>칭호</dt><dd id="slotTitle">—</dd></div>
          <div class="pf-slotrow"><dt>힘 / 민첩 / 지능</dt><dd id="slotStats">— / — / —</dd></div>
        </dl>
        <p class="pf-soon">미니게임 성적 연동 예정</p>
      </div>
    </section>

    <section class="pf-editor" id="editor" tabindex="-1" aria-labelledby="editorTitle">
      <h2 id="editorTitle" class="sr-only">아바타 꾸미기</h2>

      <div class="pf-tabs" id="tabs" role="tablist" aria-label="꾸미기 카테고리"></div>
      <div id="panel" role="tabpanel"></div>

      <div class="pf-actions">
        <button class="pf-btn" type="button" id="random">🎲 랜덤</button>
        <button class="pf-btn" type="button" id="reset">초기화</button>
        <span class="pf-saved" id="saved" role="status" aria-live="polite"></span>
      </div>
    </section>

  </main>

</div>

<footer>Englknight · 캐릭터는 이 브라우저에만 저장됩니다</footer>

<script>
(function () {
  'use strict';

  const STORE_KEY = 'uks-profile-v1';

  /* =========================================================
     파츠 정의 — 전부 인라인 SVG. 외부 이미지·폰트·CDN 없음.
     새 파츠를 추가하려면 아래 배열에 { id, name, draw } 하나만 추가하면 된다.
     ========================================================= */

  const SHADE = 'rgba(0,0,0,.2)';
  const SHEEN = 'rgba(255,255,255,.22)';

  const BACKGROUNDS = [
    { id: 'night',  name: '심야',  from: '#1b2140', to: '#0a0b12' },
    { id: 'neon',   name: '네온',  from: '#2a1150', to: '#00323f' },
    { id: 'sunset', name: '석양',  from: '#4a1d3d', to: '#7a3320' },
    { id: 'forest', name: '숲',    from: '#123024', to: '#0a1a14' },
    { id: 'flame',  name: '화염',  from: '#4a1414', to: '#1a0808' },
    { id: 'galaxy', name: '은하',  from: '#191b4a', to: '#3d1a52' }
  ];

  const SKIN_COLORS = [
    { v: '#f6d5bd', name: '밝은 피부' }, { v: '#eab896', name: '중간 피부' },
    { v: '#cf9268', name: '구릿빛' },   { v: '#a86b46', name: '짙은 피부' },
    { v: '#71472f', name: '검은 피부' }, { v: '#9fd8c0', name: '엘프 피부' }
  ];

  const HAIR_COLORS = [
    { v: '#232633', name: '검정' }, { v: '#5a3a24', name: '갈색' },
    { v: '#a8642f', name: '주황' }, { v: '#e0bd72', name: '금발' },
    { v: '#eef0f8', name: '백발' }, { v: '#00e5ff', name: '사이언' },
    { v: '#ff2d95', name: '핑크' }, { v: '#9b6bff', name: '보라' }
  ];

  const OUTFIT_COLORS = [
    { v: '#3b82f6', name: '파랑' }, { v: '#00e5ff', name: '사이언' },
    { v: '#22c55e', name: '초록' }, { v: '#f59e0b', name: '노랑' },
    { v: '#ff2d95', name: '핑크' }, { v: '#8b5cf6', name: '보라' },
    { v: '#e8eaf2', name: '흰색' }, { v: '#39405e', name: '회색' }
  ];

  const ACC_COLORS = [
    { v: '#f5c542', name: '금색' }, { v: '#e8eaf2', name: '은색' },
    { v: '#00e5ff', name: '사이언' }, { v: '#ff2d95', name: '핑크' },
    { v: '#9b6bff', name: '보라' }, { v: '#39405e', name: '검정' }
  ];

  const HAIR = [
    { id: 'short', name: '단발', draw: c => `
      <path d="M60,82 Q58,32 100,32 Q142,32 140,82 Q140,64 131,56 Q117,44 100,46 Q83,44 69,56 Q60,64 60,82 Z" fill="${c}"/>` },
    { id: 'long', name: '장발', draw: c => `
      <path d="M60,82 Q58,32 100,32 Q142,32 140,82 L143,172 Q143,180 135,180 L126,180 Q131,120 126,86 Q118,60 100,58 Q82,60 74,86 Q69,120 74,180 L65,180 Q57,180 57,172 Z" fill="${c}"/>` },
    { id: 'pony', name: '포니테일', draw: c => `
      <path d="M137,74 Q163,86 159,126 Q157,152 142,160 Q153,133 149,105 Q145,85 132,79 Z" fill="${c}"/>
      <path d="M60,82 Q58,32 100,32 Q142,32 140,82 Q140,64 131,56 Q117,44 100,46 Q83,44 69,56 Q60,64 60,82 Z" fill="${c}"/>` },
    { id: 'spiky', name: '스파이크', draw: c => `
      <path d="M60,84 L66,44 L79,64 L87,32 L100,58 L113,32 L121,64 L134,44 L140,84 Q135,58 100,56 Q65,58 60,84 Z" fill="${c}"/>` },
    { id: 'bald', name: '삭발', draw: () => '' }
  ];

  // 소매는 몸통보다 먼저 그린다. 그래야 몸통이 이음새를 덮어 어깨가 매끄럽게 이어진다.
  const OUTFIT = [
    { id: 'tee', name: '반팔티', draw: c => `
      <rect x="46" y="148" width="23" height="34" rx="11" fill="${c}"/>
      <rect x="131" y="148" width="23" height="34" rx="11" fill="${c}"/>
      <path d="M64,160 Q64,140 88,134 L112,134 Q136,140 136,160 L136,222 Q136,231 127,231 L73,231 Q64,231 64,222 Z" fill="${c}"/>
      <path d="M70,152 Q66,168 68,182 M130,152 Q134,168 132,182"
            stroke="${SHADE}" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M88,135 Q100,152 112,135 Q100,143 88,135 Z" fill="${SHADE}"/>` },
    { id: 'hoodie', name: '후드티', draw: c => `
      <rect x="45" y="148" width="24" height="68" rx="12" fill="${c}"/>
      <rect x="131" y="148" width="24" height="68" rx="12" fill="${c}"/>
      <path d="M62,160 Q62,138 88,132 L112,132 Q138,138 138,160 L138,224 Q138,233 128,233 L72,233 Q62,233 62,224 Z" fill="${c}"/>
      <path d="M70,150 Q65,182 67,214 M130,150 Q135,182 133,214"
            stroke="${SHADE}" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M80,131 Q100,118 120,131 Q116,146 100,148 Q84,146 80,131 Z" fill="${SHADE}"/>
      <rect x="81" y="190" width="38" height="24" rx="7" fill="${SHADE}"/>
      <path d="M93,148 L95,168 M107,148 L105,168" stroke="${SHEEN}" stroke-width="3" stroke-linecap="round"/>` },
    { id: 'dress', name: '원피스', draw: c => `
      <rect x="47" y="148" width="22" height="30" rx="11" fill="${c}"/>
      <rect x="131" y="148" width="22" height="30" rx="11" fill="${c}"/>
      <path d="M66,158 Q66,138 88,132 L112,132 Q134,138 134,158 L148,246 Q149,254 140,254 L60,254 Q51,254 52,246 Z" fill="${c}"/>
      <rect x="64" y="186" width="72" height="10" fill="${SHADE}"/>
      <path d="M88,133 Q100,150 112,133 Q100,141 88,133 Z" fill="${SHADE}"/>` },
    { id: 'armor', name: '갑옷', draw: c => `
      <path d="M64,158 Q64,138 88,133 L112,133 Q136,138 136,158 L136,220 Q136,233 100,240 Q64,233 64,220 Z" fill="${c}"/>
      <path d="M66,154 Q42,152 40,170 Q40,184 55,186 Q70,184 70,168 Z" fill="${c}"/>
      <path d="M134,154 Q158,152 160,170 Q160,184 145,186 Q130,184 130,168 Z" fill="${c}"/>
      <path d="M100,140 L100,237" stroke="${SHADE}" stroke-width="4"/>
      <path d="M74,172 Q100,183 126,172" stroke="${SHEEN}" stroke-width="3.5" fill="none"/>
      <path d="M74,198 Q100,209 126,198" stroke="${SHEEN}" stroke-width="3.5" fill="none"/>` },
    { id: 'robe', name: '마법로브', draw: c => `
      <path d="M66,150 L42,172 L50,212 L74,200 Z" fill="${c}"/>
      <path d="M134,150 L158,172 L150,212 L126,200 Z" fill="${c}"/>
      <path d="M66,158 Q66,136 88,130 L112,130 Q134,136 134,158 L146,252 Q147,260 138,260 L62,260 Q53,260 54,252 Z" fill="${c}"/>
      <path d="M88,131 L100,164 L112,131 Z" fill="${SHADE}"/>
      <rect x="70" y="196" width="60" height="11" rx="4" fill="${SHADE}"/>
      <path d="M100,207 L100,260" stroke="${SHEEN}" stroke-width="4"/>` }
  ];

  const ACC = [
    { id: 'none', name: '없음', draw: () => '' },
    { id: 'glasses', name: '안경', draw: c => `
      <g fill="none" stroke="${c}" stroke-width="3.5" stroke-linecap="round">
        <circle cx="86" cy="80" r="12"/><circle cx="114" cy="80" r="12"/>
        <path d="M98,80 L102,80"/><path d="M74,77 L63,74"/><path d="M126,77 L137,74"/>
      </g>` },
    { id: 'crown', name: '왕관', draw: c => `
      <path d="M70,46 L78,20 L90,37 L100,11 L110,37 L122,20 L130,46 Z" fill="${c}"/>
      <rect x="70" y="44" width="60" height="10" rx="4" fill="${c}"/>
      <circle cx="100" cy="31" r="3.5" fill="${SHEEN}"/>` },
    { id: 'headset', name: '헤드셋', draw: c => `
      <path d="M62,80 Q62,34 100,34 Q138,34 138,80" stroke="${c}" stroke-width="7" fill="none" stroke-linecap="round"/>
      <rect x="51" y="70" width="19" height="32" rx="9" fill="${c}"/>
      <rect x="130" y="70" width="19" height="32" rx="9" fill="${c}"/>
      <path d="M143,98 Q157,105 149,118" stroke="${c}" stroke-width="4" fill="none" stroke-linecap="round"/>
      <circle cx="148" cy="120" r="4.5" fill="${c}"/>` },
    { id: 'horns', name: '뿔', draw: c => `
      <path d="M69,46 Q56,23 62,11 Q77,22 81,42 Z" fill="${c}"/>
      <path d="M131,46 Q144,23 138,11 Q123,22 119,42 Z" fill="${c}"/>` }
  ];

  const DEFAULTS = {
    name: '', bg: 'night', skin: '#f6d5bd',
    hair: 'short', hairColor: '#232633',
    outfit: 'tee', outfitColor: '#3b82f6',
    acc: 'none', accColor: '#f5c542'
  };

  /* ===== 상태 ===== */
  let state = Object.assign({}, DEFAULTS);

  const find = (list, id) => list.find(x => x.id === id) || list[0];

  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return;
      const saved = JSON.parse(raw);
      // 저장된 값 중 아는 키만 받아들인다 (스키마가 바뀌어도 깨지지 않게)
      Object.keys(DEFAULTS).forEach(k => {
        if (typeof saved[k] === 'string') state[k] = saved[k];
      });
    } catch (e) {
      /* 사생활 보호 모드 등으로 읽기가 막혀도 기본값으로 계속 동작한다 */
    }
  }

  let savedTimer = null;
  function save() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
      note('저장됨');
    } catch (e) {
      note('이 브라우저에서는 저장할 수 없습니다');
    }
  }

  function note(msg) {
    const el = document.getElementById('saved');
    el.textContent = msg;
    clearTimeout(savedTimer);
    savedTimer = setTimeout(() => { el.textContent = ''; }, 2000);
  }

  /* ===== 아바타 그리기 ===== */
  function avatarSVG() {
    const bg   = find(BACKGROUNDS, state.bg);
    const skin = state.skin;
    // 목·귀는 얼굴보다 살짝 어둡게 보이도록 그림자를 덮는다
    return `
<svg viewBox="0 0 200 280" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="${avatarLabel()}">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${bg.from}"/>
      <stop offset="100%" stop-color="${bg.to}"/>
    </linearGradient>
  </defs>
  <rect width="200" height="280" fill="url(#bgGrad)"/>
  <ellipse cx="100" cy="266" rx="60" ry="12" fill="rgba(0,0,0,.28)"/>

  <!-- 몸 — 팔은 몸통 좌우로 조금 겹치게 두어야 어깨가 이어져 보인다 -->
  <g>
    <rect x="83" y="218" width="15" height="46" rx="7.5" fill="${skin}"/>
    <rect x="102" y="218" width="15" height="46" rx="7.5" fill="${skin}"/>
    <rect x="48" y="150" width="19" height="66" rx="9.5" fill="${skin}"/>
    <rect x="133" y="150" width="19" height="66" rx="9.5" fill="${skin}"/>
    <path d="M64,160 Q64,140 88,134 L112,134 Q136,140 136,160 L136,222 Q136,231 127,231 L73,231 Q64,231 64,222 Z" fill="${skin}"/>
    <rect x="90" y="108" width="20" height="32" rx="9" fill="${skin}"/>
    <rect x="90" y="108" width="20" height="32" rx="9" fill="${SHADE}"/>
    <ellipse cx="64" cy="84" rx="7" ry="10" fill="${skin}"/>
    <ellipse cx="136" cy="84" rx="7" ry="10" fill="${skin}"/>
    <ellipse cx="100" cy="78" rx="37" ry="41" fill="${skin}"/>
  </g>

  ${find(OUTFIT, state.outfit).draw(state.outfitColor)}

  <!-- 얼굴 -->
  <g>
    <ellipse cx="74" cy="93" rx="7" ry="4.5" fill="#ff8fae" opacity=".35"/>
    <ellipse cx="126" cy="93" rx="7" ry="4.5" fill="#ff8fae" opacity=".35"/>
    <ellipse cx="86" cy="80" rx="4.5" ry="5.5" fill="#1b1d28"/>
    <ellipse cx="114" cy="80" rx="4.5" ry="5.5" fill="#1b1d28"/>
    <circle cx="87.6" cy="78" r="1.6" fill="#fff" opacity=".9"/>
    <circle cx="115.6" cy="78" r="1.6" fill="#fff" opacity=".9"/>
    <path d="M92,97 Q100,103 108,97" stroke="#1b1d28" stroke-width="3"
          fill="none" stroke-linecap="round"/>
  </g>

  ${find(HAIR, state.hair).draw(state.hairColor)}
  ${find(ACC, state.acc).draw(state.accColor)}
</svg>`;
  }

  function avatarLabel() {
    const skinName   = (SKIN_COLORS.find(c => c.v === state.skin) || {}).name || '기본';
    const hairName   = find(HAIR, state.hair).name;
    const hairColor  = (HAIR_COLORS.find(c => c.v === state.hairColor) || {}).name || '';
    const outfitName = find(OUTFIT, state.outfit).name;
    const outColor   = (OUTFIT_COLORS.find(c => c.v === state.outfitColor) || {}).name || '';
    const accName    = find(ACC, state.acc).name;
    const bgName     = find(BACKGROUNDS, state.bg).name;
    return `${skinName}, ${hairColor} ${hairName} 머리, ${outColor} ${outfitName}, `
         + `액세서리 ${accName}, 배경 ${bgName}`;
  }

  /* ===== 미리보기 조각 (버튼 안에 들어가는 작은 그림) ===== */
  function preview(viewBox, inner, bgFill) {
    return `<svg viewBox="${viewBox}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect x="-500" y="-500" width="1200" height="1200" fill="${bgFill || 'transparent'}"/>
      ${inner}</svg>`;
  }

  /* ===== 카테고리 정의 ===== */
  const TABS = [
    {
      id: 'bg', label: '배경',
      groups: [{
        title: '배경', key: 'bg', list: BACKGROUNDS,
        render: b => `<span class="pf-chipbg" style="background:linear-gradient(180deg,${b.from},${b.to})"></span>`
      }]
    },
    {
      id: 'skin', label: '피부',
      groups: [{ title: '피부톤', key: 'skin', colors: SKIN_COLORS }]
    },
    {
      id: 'hair', label: '머리',
      groups: [
        { title: '스타일', key: 'hair', list: HAIR,
          render: h => preview('50 18 100 100',
            `<ellipse cx="100" cy="78" rx="37" ry="41" fill="${state.skin}"/>`
            + (h.draw(state.hairColor) || `<text x="100" y="86" font-size="22" fill="#8b90a8" text-anchor="middle">—</text>`),
            '#0a0b12') },
        { title: '색상', key: 'hairColor', colors: HAIR_COLORS }
      ]
    },
    {
      id: 'outfit', label: '옷',
      groups: [
        { title: '스타일', key: 'outfit', list: OUTFIT,
          render: o => preview('34 120 132 132', o.draw(state.outfitColor), '#0a0b12') },
        { title: '색상', key: 'outfitColor', colors: OUTFIT_COLORS }
      ]
    },
    {
      id: 'acc', label: '액세서리',
      groups: [
        { title: '종류', key: 'acc', list: ACC,
          render: a => preview('44 4 112 112',
            `<ellipse cx="100" cy="78" rx="37" ry="41" fill="${state.skin}"/>`
            + find(HAIR, state.hair).draw(state.hairColor)
            + (a.draw(state.accColor) || ''),
            '#0a0b12') },
        { title: '색상', key: 'accColor', colors: ACC_COLORS }
      ]
    }
  ];

  let activeTab = TABS[0].id;

  /* ===== 렌더링 ===== */
  // 치환표는 최초 1회만 만든다 (호출마다 객체를 새로 만들지 않도록)
  const ESC = { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ESC[c]);

  // 자주 쓰는 요소는 한 번만 찾아 둔다
  const avatarEl = document.getElementById('avatar');
  const tabsEl   = document.getElementById('tabs');
  const panelEl  = document.getElementById('panel');

  function renderAvatar() {
    avatarEl.innerHTML = avatarSVG();
  }

  // 탭 버튼은 목록이 고정이라 최초 1회만 만든다.
  function buildTabs() {
    tabsEl.innerHTML = TABS.map(t => `
      <button class="pf-tab" type="button" role="tab" id="tab-${t.id}"
              aria-controls="panel" data-tab="${t.id}"
              aria-selected="${t.id === activeTab}"
              tabindex="${t.id === activeTab ? '0' : '-1'}">${esc(t.label)}</button>`).join('');
  }

  // 탭을 옮길 때는 버튼을 다시 만들지 않고 선택 상태만 맞춘다.
  // (버튼이 살아 있으므로 이어지는 focus() 도 그대로 동작한다)
  function syncTabs() {
    tabsEl.querySelectorAll('.pf-tab').forEach(b => {
      const on = b.dataset.tab === activeTab;
      b.setAttribute('aria-selected', String(on));
      b.tabIndex = on ? 0 : -1;
    });
  }

  function renderPanel() {
    const tab = TABS.find(t => t.id === activeTab);
    panelEl.setAttribute('aria-labelledby', 'tab-' + tab.id);

    panelEl.innerHTML = tab.groups.map(g => {
      if (g.colors) {
        return `<div class="pf-section"><h2>${esc(g.title)}</h2><div class="pf-colors">`
          + g.colors.map(c => `
            <button class="pf-color" type="button" data-key="${g.key}" data-val="${esc(c.v)}"
                    aria-pressed="${state[g.key] === c.v}" aria-label="${esc(c.name)}"
                    style="background:${esc(c.v)}"></button>`).join('')
          + `</div></div>`;
      }
      return `<div class="pf-section"><h2>${esc(g.title)}</h2><div class="pf-items">`
        + g.list.map(item => `
          <button class="pf-item" type="button" data-key="${g.key}" data-val="${esc(item.id)}"
                  aria-pressed="${state[g.key] === item.id}">
            ${g.render(item)}<span>${esc(item.name)}</span>
          </button>`).join('')
        + `</div></div>`;
    }).join('');
  }

  function renderAll() { buildTabs(); renderPanel(); renderAvatar(); }

  /* ===== 이벤트 ===== */
  tabsEl.addEventListener('click', e => {
    const btn = e.target.closest('.pf-tab');
    if (!btn) return;
    activeTab = btn.dataset.tab;
    syncTabs(); renderPanel();
    document.getElementById('tab-' + activeTab).focus();
  });

  // 탭 목록은 좌우 방향키로도 이동할 수 있어야 한다
  tabsEl.addEventListener('keydown', e => {
    const dir = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
    if (!dir) return;
    e.preventDefault();
    const i = TABS.findIndex(t => t.id === activeTab);
    activeTab = TABS[(i + dir + TABS.length) % TABS.length].id;
    syncTabs(); renderPanel();
    document.getElementById('tab-' + activeTab).focus();
  });

  panelEl.addEventListener('click', e => {
    const btn = e.target.closest('[data-key]');
    if (!btn) return;
    const key = btn.dataset.key;
    state[key] = btn.dataset.val;

    // 스타일 미리보기는 현재 "색상"으로 그려진다. 따라서 색상을 고른 경우에만
    // 패널을 다시 만들면 되고, 스타일을 고른 경우에는 선택 표시만 바꾸면 된다.
    // (기존에는 어느 쪽이든 패널 전체와 미리보기 SVG를 통째로 다시 조립했다)
    if (btn.classList.contains('pf-color')) {
      // 패널을 다시 만들면 방금 누른 버튼이 사라져 포커스가 <body>로 떨어진다.
      // 스타일 쪽은 재생성을 안 하므로 포커스가 유지되는데, 색상 쪽만
      // 풀리면 키보드 조작이 들쭉날쭉해진다. 같은 자리로 되돌려 맞춘다.
      const hadFocus = document.activeElement === btn;
      const val = btn.dataset.val;
      renderPanel();
      if (hadFocus) {
        const again = panelEl.querySelector(
          '[data-key="' + key + '"][data-val="' + val + '"]');
        if (again) again.focus();
      }
    } else {
      btn.parentElement.querySelectorAll('[data-key="' + key + '"]')
        .forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
    }

    renderAvatar(); save();
  });

  const nickname = document.getElementById('nickname');
  nickname.addEventListener('input', e => {
    state.name = e.target.value;
    save();
  });

  document.getElementById('random').addEventListener('click', () => {
    const pick = a => a[Math.floor(Math.random() * a.length)];
    state.bg          = pick(BACKGROUNDS).id;
    state.skin        = pick(SKIN_COLORS).v;
    state.hair        = pick(HAIR).id;
    state.hairColor   = pick(HAIR_COLORS).v;
    state.outfit      = pick(OUTFIT).id;
    state.outfitColor = pick(OUTFIT_COLORS).v;
    state.acc         = pick(ACC).id;
    state.accColor    = pick(ACC_COLORS).v;
    renderPanel(); renderAvatar(); save();
    note('랜덤 적용됨');
  });

  document.getElementById('reset').addEventListener('click', () => {
    const keepName = state.name;
    state = Object.assign({}, DEFAULTS, { name: keepName });
    renderPanel(); renderAvatar(); save();
    note('초기화됨');
  });

  /* ===== 시작 ===== */
  load();
  nickname.value = state.name;
  renderAll();
})();
</script>
</body>
</html>
