<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>방명록 — Englknight</title>
<meta name="description" content="Englknight를 다녀간 사람들이 남긴 한마디">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📜</text></svg>">
<!-- 허브와 같은 팔레트·포커스·모션 규칙을 그대로 쓴다 -->
<link rel="stylesheet" href="../assets/style.css">
<style>
  .gb-back {
    display: inline-flex; align-items: center; gap: var(--s2);
    min-height: var(--tap);
    color: var(--muted); text-decoration: none;
    font-size: 14px; font-weight: 600;
  }
  .gb-back:hover { color: var(--text); }

  .gb-head { text-align: center; padding: var(--s4) 0 var(--s6); }
  .gb-head h1 {
    font-size: clamp(28px, 6vw, 44px); font-weight: 900; letter-spacing: -1px;
    background: linear-gradient(120deg, var(--accent), #a78bfa 55%, var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .gb-head p { margin-top: var(--s2); color: var(--muted); font-size: 14px; }

  .gb-main { max-width: 720px; margin: 0 auto; padding-bottom: var(--s8); }

  /* ===== 작성 폼 ===== */
  .gb-form {
    background: linear-gradient(180deg, var(--card-2), var(--card));
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: var(--s4); margin-bottom: var(--s6);
  }
  .gb-field { margin-bottom: var(--s3); }
  .gb-field.name { max-width: 240px; }
  .gb-field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: var(--s1); }

  .gb-input, .gb-text {
    width: 100%; min-height: var(--tap);
    background: var(--bg-2); border: 1px solid var(--line);
    border-radius: var(--s3); padding: var(--s2) var(--s3);
    color: var(--text); font-size: 15px; font-family: inherit;
    outline: none; transition: border-color .18s, box-shadow .18s;
  }
  .gb-text { min-height: 96px; resize: vertical; line-height: 1.55; }
  .gb-input::placeholder, .gb-text::placeholder { color: var(--muted-2); }
  .gb-input:focus-visible, .gb-text:focus-visible {
    border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,229,255,.14); outline: none;
  }

  .gb-bar { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; }
  .gb-count { font-size: 12px; color: var(--muted-2); font-variant-numeric: tabular-nums; }
  .gb-send {
    margin-left: auto; min-height: var(--tap);
    padding: var(--s2) var(--s6);
    background: var(--accent); border: 1px solid var(--accent); border-radius: 999px;
    color: #06121a; font-size: 14px; font-weight: 700; font-family: inherit;
    cursor: pointer; transition: opacity .18s;
  }
  .gb-send:disabled { opacity: .45; cursor: not-allowed; }
  .gb-note { font-size: 12px; color: var(--muted-2); margin-top: var(--s3); line-height: 1.65; }
  .gb-note b { color: var(--muted); }

  /* ===== 목록 ===== */
  .gb-listhead {
    display: flex; align-items: center; gap: var(--s3);
    margin-bottom: var(--s3);
  }
  .gb-listhead h2 { font-size: 13px; color: var(--muted); font-weight: 700; }
  .gb-reload {
    margin-left: auto; min-height: 32px;
    background: none; border: 1px solid var(--line); border-radius: 999px;
    padding: var(--s1) var(--s3);
    color: var(--muted); font-size: 12px; font-family: inherit; cursor: pointer;
    transition: color .18s, border-color .18s;
  }
  .gb-reload:hover { color: var(--text); border-color: var(--line-2); }
  .gb-reload:disabled { opacity: .5; cursor: default; }

  .gb-list { list-style: none; display: flex; flex-direction: column; gap: var(--s3); }
  .gb-entry {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: var(--s4);
  }
  .gb-entry.mine { border-color: var(--line-2); }
  .gb-meta {
    display: flex; align-items: baseline; gap: var(--s2);
    flex-wrap: wrap; margin-bottom: var(--s2);
  }
  .gb-name { font-weight: 800; font-size: 15px; }
  .gb-time { font-size: 12px; color: var(--muted-2); font-variant-numeric: tabular-nums; }
  .gb-badge {
    font-size: 11px; font-weight: 700; color: var(--accent);
    border: 1px solid currentColor; border-radius: 999px; padding: 1px var(--s2);
  }
  .gb-body { font-size: 14px; line-height: 1.65; color: var(--text); white-space: pre-wrap; word-break: break-word; }

  .gb-empty {
    text-align: center; padding: var(--s8) var(--s4);
    color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius);
  }
  .gb-empty .big { font-size: 40px; margin-bottom: var(--s3); }

  @media (max-width: 560px) {
    .gb-field.name { max-width: none; }
    .gb-send { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>

<a class="skip" href="#write">방명록 쓰기로 건너뛰기</a>

<div class="wrap">

  <p><a class="gb-back" href="../index.html"><span aria-hidden="true">←</span> 허브로 돌아가기</a></p>

  <div class="gb-head">
    <h1>방명록</h1>
    <p>다녀간 흔적을 한 줄 남겨주세요.</p>
  </div>

  <main class="gb-main">

    <form class="gb-form" id="write">
      <div class="gb-field name">
        <label for="gbName">이름</label>
        <input id="gbName" class="gb-input" type="text" maxlength="20"
               placeholder="이름 없는 나그네" autocomplete="off">
      </div>
      <div class="gb-field">
        <label for="gbText">한마디</label>
        <textarea id="gbText" class="gb-text" maxlength="300"
                  placeholder="여기 다녀갑니다!"></textarea>
      </div>
      <div class="gb-bar">
        <span class="gb-count" id="count">0 / 300</span>
        <button class="gb-send" type="submit" id="send" disabled>남기기</button>
      </div>
      <p class="gb-note" id="formNote">
        누구나 볼 수 있는 공개 게시판입니다. 개인정보는 적지 마세요.<br>
        <b>한 번 남긴 글은 직접 지울 수 없습니다.</b> 지워야 할 글이 있으면 관리자에게 알려주세요.
      </p>
    </form>

    <div class="gb-listhead">
      <h2 id="listCount">불러오는 중…</h2>
      <button class="gb-reload" type="button" id="reload">새로고침</button>
    </div>
    <ul class="gb-list" id="list" aria-live="polite"></ul>

  </main>

</div>

<footer>Englknight · 남긴 글은 계속 보관됩니다</footer>

<script>
(function () {
  'use strict';

  /* =========================================================
     방명록 저장소
     ---------------------------------------------------------
     Firebase Realtime Database REST API를 fetch로 직접 부른다.
     SDK도 API 키도 쓰지 않으므로 외부 스크립트를 하나도 안 불러오고,
     그래서 file:// 로 열어도 동작한다 (CORS 확인: Origin null 허용).

     서버 보안 규칙이 강제하는 것 — 클라이언트가 우회할 수 없다:
       · name 1~20자 / text 1~300자 / ts 숫자
       · 추가만 가능. 수정·삭제는 서버가 거부한다.
     따라서 "내 글 삭제" 같은 기능은 만들 수 없다. 지워야 할 글은
     관리자가 Firebase 콘솔에서 직접 지운다. 그 사실을 폼에 안내해 둔다.

     이 방식은 이전 공용 MQTT 브로커 방식을 대체한 것이다. 브로커는
     테스트용이라 retain 메시지를 주기적으로 비웠고, 실제로 올린 글이
     같은 날 사라지는 것을 확인했다.
     ========================================================= */

  var DB    = 'https://tetris260827-30fe0-default-rtdb.asia-southeast1.firebasedatabase.app';
  var PATH  = '/guestbook.json';
  var SHOW  = 50;             // 화면에 표시할 최근 글 수
  var MAX_NAME = 20;
  var MAX_TEXT = 300;
  var COOLDOWN_MS = 15000;    // 도배 방지: 한 브라우저에서 15초에 한 번

  var KEY_MINE = 'englknight-gb-mine';   // 내가 쓴 글 키 (배지 표시용)
  var KEY_LAST = 'englknight-gb-last';   // 마지막 작성 시각
  var KEY_NAME = 'englknight-gb-name';   // 이름 기억

  var listEl   = document.getElementById('list');
  var countEl  = document.getElementById('listCount');
  var nameEl   = document.getElementById('gbName');
  var textEl   = document.getElementById('gbText');
  var sendEl   = document.getElementById('send');
  var charEl   = document.getElementById('count');
  var formEl   = document.getElementById('write');
  var noteEl   = document.getElementById('formNote');
  var reloadEl = document.getElementById('reload');

  var NOTE_DEFAULT = noteEl.innerHTML;

  var ESC = { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' };
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ESC[c]; });
  }

  var store = {
    get: function (k, dflt) {
      try { var v = localStorage.getItem(k); return v == null ? dflt : v; }
      catch (e) { return dflt; }
    },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  var mine = (function () {
    try { return JSON.parse(store.get(KEY_MINE, '[]')) || []; } catch (e) { return []; }
  })();

  var entries = [];
  var busy = false;

  /* ===== 화면 ===== */

  function when(ts) {
    var d = new Date(ts);
    if (isNaN(d.getTime())) return '';
    var p = function (n) { return n < 10 ? '0' + n : '' + n; };
    return d.getFullYear() + '.' + p(d.getMonth() + 1) + '.' + p(d.getDate())
         + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function render() {
    if (!entries.length) {
      listEl.innerHTML =
        '<li class="gb-empty"><div class="big" aria-hidden="true">📜</div>'
        + '<p>아직 아무도 남기지 않았어요. 첫 글을 남겨보세요.</p></li>';
      return;
    }
    listEl.innerHTML = entries.map(function (e) {
      var isMine = mine.indexOf(e.key) !== -1;
      return '<li class="gb-entry' + (isMine ? ' mine' : '') + '">'
        + '<div class="gb-meta">'
        +   '<span class="gb-name">' + esc(e.name || '이름 없는 나그네') + '</span>'
        +   '<span class="gb-time">' + esc(when(e.ts)) + '</span>'
        +   (isMine ? '<span class="gb-badge">내 글</span>' : '')
        + '</div>'
        + '<div class="gb-body">' + esc(e.text) + '</div>'
        + '</li>';
    }).join('');
  }

  /* ===== 불러오기 ===== */

  function load() {
    reloadEl.disabled = true;
    var url = DB + PATH + '?orderBy=' + encodeURIComponent('"ts"') + '&limitToLast=' + SHOW;

    return fetch(url, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('http ' + r.status);
        return r.json();
      })
      .then(function (data) {
        entries = [];
        if (data && typeof data === 'object') {
          Object.keys(data).forEach(function (k) {
            var v = data[k];
            if (v && typeof v.text === 'string') {
              entries.push({ key: k, name: v.name, text: v.text, ts: v.ts });
            }
          });
        }
        entries.sort(function (a, b) { return (b.ts || 0) - (a.ts || 0); });
        countEl.textContent = entries.length
          ? '남겨진 글 ' + entries.length + '개'
          : '남겨진 글';
        render();
      })
      .catch(function () {
        // 목록을 못 불러와도 글쓰기는 계속 되게 둔다. 자리만 조용히 비운다.
        entries = [];
        countEl.textContent = '목록을 불러오지 못했습니다';
        listEl.innerHTML =
          '<li class="gb-empty"><p>목록을 불러오지 못했어요. 새로고침을 눌러보세요.</p></li>';
      })
      .then(function () { reloadEl.disabled = false; });
  }

  /* ===== 입력 ===== */

  nameEl.value = store.get(KEY_NAME, '');

  function refreshForm() {
    var len = textEl.value.trim().length;
    charEl.textContent = len + ' / ' + MAX_TEXT;
    sendEl.disabled = busy || len === 0 || len > MAX_TEXT;
  }

  textEl.addEventListener('input', refreshForm);
  nameEl.addEventListener('input', function () { store.set(KEY_NAME, nameEl.value); });
  reloadEl.addEventListener('click', function () { load(); });

  formEl.addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (sendEl.disabled) return;

    var last = parseInt(store.get(KEY_LAST, '0'), 10) || 0;
    var wait = COOLDOWN_MS - (Date.now() - last);
    if (wait > 0) {
      noteEl.textContent = Math.ceil(wait / 1000) + '초 뒤에 다시 남길 수 있어요.';
      return;
    }

    // 서버 규칙이 name 1자 이상을 요구하므로 비어 있으면 기본 이름을 넣는다
    var body = {
      name: (nameEl.value.trim() || '이름 없는 나그네').slice(0, MAX_NAME),
      text: textEl.value.trim().slice(0, MAX_TEXT),
      ts: Date.now()
    };

    busy = true; refreshForm();
    noteEl.textContent = '남기는 중…';

    fetch(DB + PATH, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    })
      .then(function (r) {
        if (!r.ok) throw new Error('http ' + r.status);
        return r.json();
      })
      .then(function (res) {
        if (res && res.name) {
          mine.push(res.name);
          store.set(KEY_MINE, JSON.stringify(mine.slice(-200)));
        }
        store.set(KEY_LAST, String(Date.now()));
        textEl.value = '';
        noteEl.innerHTML = NOTE_DEFAULT;
        return load();
      })
      .catch(function () {
        noteEl.textContent = '남기지 못했습니다. 잠시 뒤 다시 시도해 주세요.';
      })
      .then(function () { busy = false; refreshForm(); });
  });

  /* ===== 시작 ===== */
  render();
  refreshForm();
  load();
})();
</script>
</body>
</html>
