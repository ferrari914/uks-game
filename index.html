<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Englknight — 나만의 기사를 키우는 RPG</title>
<meta name="description" content="미니게임으로 나만의 기사를 키우는 RPG. 캐릭터를 꾸미고 성장시키세요.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<a class="skip" href="#grid">게임 목록으로 건너뛰기</a>

<div class="wrap">

  <header>
    <h1 class="logo">ENGLKNIGHT</h1>
    <p class="tagline">Play. Grow. Knight.</p>
    <ul class="stats">
      <li class="pill">전체 <b id="statTotal">0</b></li>
      <li class="pill">플레이 가능 <b id="statReady">0</b></li>
      <li class="pill">준비중 <b id="statWip">0</b></li>
    </ul>

    <!-- 프로필은 게임이 아니므로 카드 그리드에 섞지 않고 헤더에 따로 둔다 -->
    <a class="profile-link" href="profile/index.html">
      <span class="profile-face" aria-hidden="true">🧙</span>
      <span class="profile-text">
        <b>내 캐릭터</b>
        <span>아바타를 꾸미고 성장시키기</span>
      </span>
      <span class="arrow" aria-hidden="true">→</span>
    </a>
  </header>

  <main id="main">

    <div class="toolbar">
      <div class="search-box">
        <label class="sr-only" for="search">게임 검색</label>
        <input id="search" class="search" type="search"
               placeholder="게임 이름 · 태그 검색…" autocomplete="off">
      </div>
      <nav class="filters" id="filters" aria-label="태그 필터"></nav>
    </div>

    <p id="srCount" class="sr-only" role="status" aria-live="polite"></p>

    <!-- tabindex="-1": 건너뛰기 링크로 이동했을 때 포커스가 실제로 여기 오도록 -->
    <div class="grid" id="grid" tabindex="-1"></div>

  </main>

</div>

<footer>Englknight · 게임을 추가하려면 <code>data/games.js</code> 에 항목 하나만 추가하세요</footer>

<script src="data/games.js"></script>
<script>
(function () {
  const games   = Array.isArray(window.GAMES) ? window.GAMES : [];
  const grid    = document.getElementById('grid');
  const search  = document.getElementById('search');
  const filters = document.getElementById('filters');
  const srCount = document.getElementById('srCount');

  const ALL = '전체';
  let keyword = '';
  let tagFilter = ALL;

  // 데이터가 그대로 HTML로 들어가므로 항상 이스케이프한다.
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

  // style 속성에 넣기 전 색상값 검증 (hex 아니면 기본값)
  const safeColor = (c, fallback) => /^#[0-9a-fA-F]{3,8}$/.test(c || '') ? c : fallback;

  const isReady = g => g.status === 'ready';

  // ---- 통계 ----
  document.getElementById('statTotal').textContent = games.length;
  document.getElementById('statReady').textContent = games.filter(isReady).length;
  document.getElementById('statWip').textContent   = games.filter(g => !isReady(g)).length;

  // ---- 태그 필터 버튼 ----
  const allTags = [ALL, ...new Set(games.flatMap(g => g.tags || []))];
  filters.innerHTML = allTags.map(t => `
    <button class="chip" type="button" data-tag="${esc(t)}"
            aria-pressed="${t === ALL}">${esc(t)}</button>`).join('');

  filters.addEventListener('click', e => {
    const btn = e.target.closest('.chip');
    if (!btn) return;
    tagFilter = btn.dataset.tag;
    filters.querySelectorAll('.chip')
      .forEach(c => c.setAttribute('aria-pressed', String(c === btn)));
    render();
  });

  search.addEventListener('input', e => {
    keyword = e.target.value.trim().toLowerCase();
    render();
  });

  // ---- 카드 렌더링 ----
  function cardHTML(g) {
    const ready = isReady(g);
    const c1 = safeColor((g.color || [])[0], '#3b82f6');
    const c2 = safeColor((g.color || [])[1], '#8b5cf6');
    const tags = (g.tags || []).map(t => `<li class="tag">${esc(t)}</li>`).join('');

    // 준비중인 게임은 링크가 아니므로 <a>가 아닌 <div>로 낸다.
    // (href 없는 <a>는 키보드 포커스도, 역할 전달도 되지 않는다)
    const open  = ready ? `<a class="card" href="${esc(g.path)}">` : `<div class="card locked">`;
    const close = ready ? `</a>` : `</div>`;

    return `
      ${open}
        <div class="thumb" style="background:linear-gradient(135deg,${c1},${c2})">
          <span aria-hidden="true">${esc(g.emoji || '🎮')}</span>
          <span class="badge ${ready ? 'ready' : 'wip'}">${ready ? 'PLAY' : '준비중'}</span>
        </div>
        <div class="body">
          <h2 class="title">${esc(g.title)}</h2>
          <p class="desc">${esc(g.desc || '')}</p>
          ${tags ? `<ul class="tags">${tags}</ul>` : ''}
          <p class="play">${ready ? '지금 플레이' : '제작 예정'}
            <span class="arrow" aria-hidden="true">→</span></p>
        </div>
      ${close}`;
  }

  function render() {
    const list = games.filter(g => {
      const inTag = tagFilter === ALL || (g.tags || []).includes(tagFilter);
      const hay = [g.title, g.desc, ...(g.tags || [])].join(' ').toLowerCase();
      return inTag && hay.includes(keyword);
    });

    grid.innerHTML = list.length
      ? list.map(cardHTML).join('')
      : `<div class="empty">
           <div class="big" aria-hidden="true">🔍</div>
           <p>조건에 맞는 게임이 없어요.</p>
           <button class="reset" type="button" id="reset">검색·필터 초기화</button>
         </div>`;

    srCount.textContent = list.length
      ? `게임 ${list.length}개가 표시되었습니다.`
      : '조건에 맞는 게임이 없어요.';
  }

  // 빈 상태의 초기화 버튼 (렌더링마다 새로 생기므로 위임으로 처리)
  grid.addEventListener('click', e => {
    if (!e.target.closest('#reset')) return;
    keyword = '';
    tagFilter = ALL;
    search.value = '';
    filters.querySelectorAll('.chip')
      .forEach(c => c.setAttribute('aria-pressed', String(c.dataset.tag === ALL)));
    render();
    search.focus();
  });

  render();
})();
</script>
</body>
</html>
